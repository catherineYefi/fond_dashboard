<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фонд-акселератор — финансы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ==============================================================
   Язык «Уровня правды» (v7, утверждён 22.09): нейтральный графит в тёмной теме,
   кость в светлой, медь — единственный акцент. Статус кодируется формой
   (● заполнено · ◐ частично · ○ пусто), а не цветом. Тёмная — по умолчанию.
   ============================================================== */
:root{
  --bg:#f5f2ec; --surface:#fbfaf7; --surface2:#efeae2; --surface3:#f3efe8; --line:#e2ddd3; --line2:#d0c9bd;
  --txt:#262624; --txt2:#45443f; --txt3:#6b6a66;
  --accent:#9a5b2a; --accent-soft:rgba(185,121,75,.13); --accent-line:rgba(154,91,42,.45);
  --ok:#2f7a4f; --watch:#8a6a2f; --bad:#b3362d;
  --bar-bg:#e9e4db; --bar-zone:#dcd5c9; --bar-fact:#262624; --dim:#d0c9bd; --dim2:#a39b8e;
  --sans:'Onest',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r-plate:20px; --r-card:16px; --r-group:14px;
}
html.dark{
  --bg:#151515; --surface:#1c1c1d; --surface2:#242425; --surface3:#2b2b2d; --line:#2c2c2e; --line2:#3a3a3c;
  --txt:#f2f2f0; --txt2:#cacacc; --txt3:#9d9d9f;
  --accent:#d08a52; --accent-soft:rgba(208,138,82,.15); --accent-line:rgba(208,138,82,.45);
  --ok:#5fbf8a; --watch:#c9a46a; --bad:#e07a6a;
  --bar-bg:#2b2b2d; --bar-zone:#353537; --bar-fact:#f2f2f0; --dim:#3a3a3c; --dim2:#6c6c70;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
@media(max-width:700px){.wrap{padding:18px 14px 60px}}

/* Шапка */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:14px}
.logo{display:inline-flex;align-items:center;gap:0}
.logo .a{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.logo .l{width:34px;height:2px;background:var(--accent)}
.logo .b{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent)}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--txt3);font-size:13px;margin-top:2px}
.controls{display:flex;gap:10px;align-items:center}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);
  border:1px solid var(--line2);border-radius:999px;padding:6px 12px;background:transparent;cursor:pointer}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Моно-метки: один уровень на блок */
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3)}
.kick.acc{color:var(--accent)}

/* Экран */
.screen{margin-bottom:52px}
.screen>h2{font-size:15px;font-weight:500;color:var(--txt2);margin:0 0 14px;display:flex;align-items:baseline;gap:14px}
.screen>h2 .kick{font-weight:500}

/* Сетки и плиты */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-hero{grid-template-columns:1.35fr 1fr}
@media(max-width:900px){.g3,.g4{grid-template-columns:1fr 1fr}.g-hero{grid-template-columns:1fr}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-plate);padding:22px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px}
.card.soft{background:var(--surface2);border-color:transparent}

/* Числа */
.hero{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.hero small{font-size:20px;font-weight:500;color:var(--txt3);margin-left:6px;letter-spacing:0}
.big{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--txt3)}.m2{color:var(--txt2)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .lbl{color:var(--txt2)}
.row .val{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Статус формой */
.st{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid currentColor;vertical-align:-1px;margin-right:8px;color:var(--txt3)}
.st.full{background:currentColor}
.st.half{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.st.acc{color:var(--accent)}

/* Полоска план/факт */
.bar{height:8px;border-radius:4px;background:var(--bar-bg);position:relative;overflow:hidden;margin-top:10px}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--bar-fact);border-radius:4px}
.bar>b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--txt3);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* Таблица потоков */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);font-weight:500;text-align:right;padding:0 0 10px}
th:first-child,td:first-child{text-align:left}
td{padding:10px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td.b{font-weight:600}
tr.total td{border-top:1px solid var(--line2);font-weight:700}
.scroll{overflow-x:auto}

/* Траектория */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--txt3)}
.chart .plan{fill:none;stroke:var(--dim2);stroke-width:2;stroke-dasharray:4 5}
.chart .fact{fill:none;stroke:var(--bar-fact);stroke-width:2.5}
.chart .fc{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:2 4}
.chart .gap{fill:var(--accent-soft)}
.chart .dotA{fill:var(--accent)}.chart .dotB{fill:none;stroke:var(--accent);stroke-width:2}
.chart .grid{stroke:var(--line);stroke-width:1}

/* Акценты: медь — ключевая цифра экрана и её дельта. Одна медная цифра на плиту. */
.hero.acc,.big.acc{color:var(--accent)}
.delta{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:4px 10px;margin-left:10px;vertical-align:middle;white-space:nowrap}
.delta.dim{color:var(--txt3);background:var(--surface3)}
.key{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:14px;padding:14px 16px;
  border-radius:var(--r-group);background:var(--accent-soft);border:1px solid var(--accent-line)}
.key .lbl{font-weight:600;font-size:15px}
.key .val{font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.big{font-size:32px}
.card .kick,.plate .kick{display:block}
.card .big{margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.seg button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:0;background:transparent;color:var(--txt3);border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface3);color:var(--txt)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ph{display:flex;align-items:center;gap:12px}
.mini{font-size:12.5px;color:var(--txt3)}
/* Список клиентов */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cl{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.cl .n{font-weight:600;font-size:14px}
.cl .d{font-size:12.5px;color:var(--txt3);margin-top:3px}
.cl .d b{color:var(--txt2);font-weight:600}

/* Календарь платежей */
.sched{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:700px){.sched{grid-template-columns:1fr}}
.month{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.month .mh{display:flex;justify-content:space-between;align-items:baseline}
.month .mh .kick{color:var(--txt2)}
.month .li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line);white-space:nowrap}
.month .li:first-of-type{border-top:0;margin-top:8px}

.note{font-size:12.5px;color:var(--txt3);margin-top:12px;line-height:1.5}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--txt3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(prefers-reduced-motion:no-preference){.plate,.card{transition:background .2s,border-color .2s}}
</style>
<style>
#loader{display:flex;align-items:center;gap:14px;padding:60px 0;color:var(--txt3)}
#err{display:none;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-card);padding:16px 20px;margin:20px 0}
.empty{color:var(--txt3);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div id="loader"><span class="logo"><span class="a"></span><span class="l"></span><span class="b"></span></span><span class="kick">Загружаю фид WEB</span></div>
  <div id="err"></div>
  <div id="app" style="display:none"></div>
</div>
<script>
/* ============================================================
   Финансовый дашборд фонда. Источник — вкладка WEB финмодели,
   опубликованная как CSV. Формат строк: тип · ключ · значение.
   K — скаляр; M — месяц; CL — клиент; PS — платёж; CH — канал.
   Совместимость: feed_version должен начинаться с "v17".
   ============================================================ */
const FEED_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQm44TrbgO6MvBJYKetceRUs0agWwmQOdp3QV0Dy4cOfDuX5vhDCKF3spgpVnh2gQ2E5kBOMDjeye08/pub?gid=1615904320&single=true&output=csv';
const FEED_MIN = 'v17';

// ---------- CSV ----------
function parseCSV(t){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(cell);rows.push(row);row=[];cell=''; }
    else cell+=c; }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
// Числа приходят в формате ячейки Sheets: «18 507 881», «488037,3406», «(1 840 440)», «29,5%», «-» вместо нуля
function num(v){ if(v==null) return null; let s=String(v).trim(); if(s==='') return null; if(s==='-'||s==='—'||s==='–') return 0;
  let neg=false; if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  s=s.replace(/[\s\u00A0\u202F]/g,'').replace(/[−–]/g,'-').replace(/₽|руб\.?/g,'');
  let pct=false; if(s.endsWith('%')){pct=true;s=s.slice(0,-1);}
  if(s.includes(',')&&!s.includes('.')) s=s.replace(',','.'); else s=s.replace(/,/g,'');
  const n=Number(s); if(!Number.isFinite(n)) return null; return (neg?-n:n)/(pct?100:1); }
function load(rows){
  const K={},M=[],CL=[],PS=[],CH=[];
  for(const r of rows){ const t=r[0];
    if(t==='K') K[r[1]]=r[2];
    else if(t==='M') M.push({m:num(r[1]),rp:num(r[2]),rf:num(r[3]),ep:num(r[4]),ef:num(r[5]),ap:num(r[6]),af:num(r[7]),mp:num(r[8]),mf:num(r[9])});
    else if(t==='CL') CL.push({name:r[1],co:r[2],st:r[3],tariff:r[4],tracker:r[5],note:r[6]});
    else if(t==='PS'){const a=num(r[3]); if(a>0) PS.push({name:r[1],m:num(r[2]),amount:a});}
    else if(t==='CH') CH.push({ch:r[1],inv:num(r[2])||0,col:num(r[3])||0}); }
  return {K,M,CL,PS,CH};
}

// ---------- формат ----------
const fmtM=v=>{const n=num(v); if(n==null) return '—'; return (n/1e6).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' М';};
const fmtR=v=>{const n=num(v); if(n==null) return '—'; return Math.round(n).toLocaleString('ru-RU');};
const fmtPct=v=>{const n=num(v); if(n==null) return '—'; return Math.round(n*100)+' %';};
const sign=v=>{const n=num(v); if(n==null) return '—'; return (n>=0?'+':'−')+fmtM(Math.abs(n));};
const MONTHS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONTHS_FULL=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const ST={pay:['full',''],fx:['half','acc'],deal:['half','acc'],option:['half','acc'],out:['',''],nosub:['','']};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- рендер ----------
function render(D){
  const K=D.K, fm=num(K.feed_month)||9;
  const cash=num(K.cash_calc), free=num(K.cash_free), oblig=num(K.oblig_total);
  const gp=num(K.gross_plan), gf=num(K.gross_fact), ptd=num(K.plan_todate_gross), ep=num(K.ebitda_plan), ef=num(K.ebitda_fact), etd=num(K.plan_todate_ebitda);
  const pct=(a,b)=>b?Math.max(0,Math.min(100,a/b*100)):0;
  const evT=num(K.ev_next_target), evC=num(K.ev_next_collected), evI=num(K.ev_next_invoiced);
  const dec=fm+3>12; // если три месяца вперёд выходят за год — PS уже пусты

  const oblRows=[1,2,3,4].map(i=>`<div class="row"><span class="lbl">${esc(K['oblig_'+i+'_label'])}</span><span class="val">−${fmtR(K['oblig_'+i])}</span></div>`).join('');

  const clients=D.CL.map(c=>{const [f,a]=ST[c.st]||['',''];
    const d=[c.tariff,c.tracker,c.note].filter(Boolean).map(esc).join(' · ');
    return `<div class="cl"><div class="n"><i class="st ${f} ${a}"></i>${esc(c.name)}${c.co?' · '+esc(c.co):''}</div><div class="d">${d}</div></div>`;}).join('');

  const months=[...new Set(D.PS.map(p=>p.m))].sort((a,b)=>a-b).slice(0,3);
  const sched=months.map(m=>{const items=D.PS.filter(p=>p.m===m); const tot=items.reduce((s,p)=>s+p.amount,0);
    return `<div class="month"><div class="mh"><span class="kick">${MONTHS_FULL[m-1]||m}</span><span class="big num" style="font-size:20px">${fmtM(tot)}</span></div>${items.map(p=>`<div class="li${/Новые/.test(p.name)?' muted':''}"><span>${esc(p.name)}</span><span class="num">${fmtR(p.amount)}</span></div>`).join('')}</div>`;}).join('') || '<div class="empty">Платежей по графику нет</div>';

  const chans=D.CH.filter(c=>c.inv>0||c.col>0).map(c=>`<div class="row"><span class="lbl">${esc(c.ch)}</span><span class="val">${c.inv>0?fmtM(c.inv)+' в счетах':''}${c.inv>0&&c.col>0?' · ':''}${c.col>0?fmtM(c.col)+' собрано':''}</span></div>`).join('');

  const app=document.getElementById('app');
  app.innerHTML=`
<header class="top">
  <div class="brand"><span class="logo"><span class="a"></span><span class="l"></span><span class="b"></span></span>
    <div><h1>Финансы фонда</h1><div class="sub">${esc(K.asof_label)} · план 2026 · фид ${esc(K.feed_version)}</div></div></div>
  <div class="controls"><button class="chip" id="theme" type="button">Светлая тема</button></div>
</header>

<section class="screen"><h2><span class="kick">01</span>Где фонд сейчас</h2>
  <div class="grid g-hero">
    <div class="plate"><span class="kick">Деньги на счетах · ${esc(K.cash_label)}</span>
      <div class="hero num">${fmtR(cash)}<small>₽</small></div>
      <div class="mini" style="margin-bottom:6px">из них уйдёт в ближайшие 60 дней — ${fmtM(oblig)}</div>
      ${oblRows}
      <div class="key"><span class="lbl">Свободно после обязательств</span><span class="val">${fmtM(free)}</span></div>
      <div class="note">${esc(K.updated_note)}</div></div>
    <div class="grid" style="grid-template-rows:auto 1fr">
      <div class="card"><span class="kick">Дивидендный поток</span>
        <div class="big num">${fmtR(K.div_year)} ₽${num(K.options_signed)>0?`<span class="delta">${fmtR(K.options_signed)} опцион подписан</span>`:''}</div>
        <div class="mini" style="margin-top:6px">за 2026 · первый поток — после закрытия опционов</div>
        <div class="row" style="margin-top:8px"><span class="lbl"><i class="st full acc"></i>Опцион подписан</span><span class="val">${fmtR(K.options_signed)}${K.options_signed_names?' · '+esc(K.options_signed_names):''}</span></div>
        <div class="row"><span class="lbl"><i class="st half acc"></i>В подписании</span><span class="val">${fmtR(K.options_pending)}</span></div>
        <div class="row"><span class="lbl"><i class="st"></i>Даёт дивиденды</span><span class="val">${fmtR(K.options_paying)}</span></div></div>
      <div class="card soft"><span class="kick">Что клиенты уже оплатили, но мы ещё не отработали</span>
        <div class="big num">${fmtM(K.rec_deferred)}</div>
        <div class="mini" style="margin-top:6px">${esc(K.rec_asof)} · акселерация · авансы ММ отработаны</div></div>
    </div>
  </div>
</section>

<section class="screen"><h2><span class="kick">02</span>Год 2026 — где мы относительно плана</h2>
  <div class="grid g2">
    <div class="plate"><span class="kick">Три потока выручки · gross</span>
      <div class="scroll"><table><thead><tr><th>Поток</th><th>План год</th><th>Факт</th><th>Прогноз 31.12</th></tr></thead><tbody>
        <tr><td>Акселерация</td><td>${fmtM(K.aks_plan)}</td><td class="b">${fmtM(K.aks_fact)}</td><td>${fmtM(K.aks_fc)}</td></tr>
        <tr><td>Мастермайнды</td><td>${fmtM(K.mm_plan)}</td><td class="b">${fmtM(K.mm_fact)}</td><td>${fmtM(K.mm_fc)}</td></tr>
        <tr><td>Дивиденды</td><td>${fmtM(K.div_plan)}</td><td class="b">${fmtM(K.div_fact)}</td><td>${fmtM(K.div_plan)}</td></tr>
        <tr class="total"><td>Итого gross</td><td>${fmtM(gp)}</td><td style="color:var(--accent)">${fmtM(gf)}</td><td>${fmtM(K.fc_gross)}</td></tr>
        <tr><td class="muted">без НДС</td><td class="muted">${fmtM(K.net_plan)}</td><td class="muted">${fmtM(K.net_fact)}</td><td class="muted">${fmtM(K.fc_net)}</td></tr>
      </tbody></table></div>
      <div class="bar"><i style="width:${pct(gf,gp)}%"></i><b style="left:${pct(ptd,gp)}%"></b></div>
      <div class="legend"><span><i style="background:var(--bar-fact)"></i>факт ${Math.round(pct(gf,gp))} % годового плана</span><span><i style="background:var(--accent)"></i>по графику к концу ${MONTHS[fm-1]} — ${Math.round(pct(ptd,gp))} %</span><span class="delta" style="margin-left:auto">${sign(gf-ptd)} к графику</span></div></div>
    <div class="plate"><span class="kick">Результат</span>
      <div class="grid g2" style="margin-top:10px">
        <div><div class="mini">EBITDA · факт</div><div class="big num acc">${fmtM(ef)}</div><div class="mini">план ${fmtM(ep).replace(' М','')} · прогноз ${fmtM(K.fc_ebitda).replace(' М','')}<span class="delta">${sign(ef-etd)} к графику</span></div></div>
        <div><div class="mini">Чистая прибыль · факт</div><div class="big num">${fmtM(K.np_fact)}</div><div class="mini">план ${fmtM(K.np_plan).replace(' М','')} · прогноз ${fmtM(K.fc_np).replace(' М','')}</div></div></div>
      <div class="row" style="margin-top:14px"><span class="lbl">Рентабельность EBITDA от net</span><span class="val">${fmtPct(K.ebitda_margin_fact)}</span></div>
      <div class="row"><span class="lbl">Расходы факт · план</span><span class="val">${fmtM(K.exp_fact)} · ${fmtM(K.exp_plan)}</span></div>
      <div class="row"><span class="lbl">в т.ч. трекинг компаний без подписки</span><span class="val">${fmtM(K.tr_nosub_month)} / мес</span></div>
      <div class="row"><span class="lbl">Остаток на 31.12 · прогноз</span><span class="val">${fmtM(K.cash_eoy)}</span></div></div>
  </div>
  <div class="plate" style="margin-top:14px">
    <div class="ph"><span class="kick" id="chartKick"></span><div class="seg" role="group" aria-label="Показатель"><button type="button" data-m="ebitda" aria-pressed="true">EBITDA</button><button type="button" data-m="rev" aria-pressed="false">Выручка</button></div></div>
    <svg class="chart" viewBox="0 0 1100 300" aria-label="Траектория: план, факт, прогноз">
      <line class="grid" x1="60" x2="1080" y1="250" y2="250"/><line class="grid" x1="60" x2="1080" y1="170" y2="170"/><line class="grid" x1="60" x2="1080" y1="90" y2="90"/>
      <text x="8" y="254" id="ay0"></text><text x="8" y="174" id="ay1"></text><text x="8" y="94" id="ay2"></text>
      <g id="months"></g><path class="gap" id="gap"/><polyline class="plan" id="plan"/><polyline class="fact" id="fact"/><polyline class="fc" id="fc"/>
      <circle class="dotA" r="5" id="dotA"/><circle class="dotB" r="6" id="dotB"/><text id="lblA" text-anchor="middle"></text><text id="lblB" text-anchor="end"></text>
    </svg>
    <div class="legend"><span><i style="background:var(--bar-fact)"></i>факт</span><span><i style="background:var(--dim2)"></i>план</span><span><i style="background:var(--accent)"></i>прогноз</span><span><i style="background:var(--accent-soft);height:10px"></i>отклонение от плана на сегодня</span></div>
    <div class="note" id="chartNote"></div>
  </div>
</section>

<section class="screen"><h2><span class="kick">03</span>Акселерация — двигатель подписки</h2>
  <div class="grid g4">
    <div class="card"><span class="kick acc">В акселерации</span><div class="big num acc">${fmtR(K.aks_clients_active)}</div><div class="mini">платят в рублях ${fmtR(K.aks_clients_paying)}${num(K.aks_clients_active)>num(K.aks_clients_paying)?' · валютный контур '+(num(K.aks_clients_active)-num(K.aks_clients_paying)):''}</div></div>
    <div class="card"><span class="kick">Подписка в месяц · gross</span><div class="big num">${fmtM(K.aks_sub_month_gross)}</div><div class="mini">${fmtM(K.aks_sub_month_net)} без НДС</div></div>
    <div class="card"><span class="kick">Вклад после трекеров и ЦК</span><div class="big num">${fmtM(K.aks_contrib)}</div><div class="mini">фикс команды ${fmtM(K.aks_fixed)}<span class="delta dim">${sign(K.aks_result)} в месяц без ММ</span></div></div>
    <div class="card"><span class="kick">Безубыточность без ММ</span><div class="big num">${fmtR(K.aks_be_clients)} <small style="font-size:14px;font-weight:500;color:var(--txt3)">клиентов</small></div><div class="mini">${esc(K.aks_short_text)}${K.aks_pipeline_text?`<span class="delta">в счёте: ${esc(String(K.aks_pipeline_text).split(' ')[0])}</span>`:''}</div></div>
  </div>
  <div class="grid" style="margin-top:14px;grid-template-columns:1fr">
    <div class="plate"><span class="kick">Портфель · кто платит, кто в сделке</span><div class="clients" style="margin-top:12px">${clients}</div></div>
    <div class="plate"><span class="kick">Платежи ближайших 90 дней · по графику</span>
      <div class="sched" style="margin-top:12px">${sched}</div>
      ${K.aks_pipeline_text?`<div class="row" style="margin-top:14px"><span class="lbl"><i class="st half acc"></i>В счёте, не оплачено</span><span class="val">${esc(K.aks_pipeline_text)}</span></div>`:''}
      <div class="row"><span class="lbl">Отработано клиентам · признание</span><span class="val">${fmtM(K.rec_earned_ytd)} из ${fmtM(K.aks_cash_ytd)}</span></div></div>
  </div>
</section>

<section class="screen"><h2><span class="kick">04</span>События</h2>
  <div class="grid g-hero">
    <div class="plate"><span class="kick acc">${esc(K.ev_next_title)} · ${esc(K.ev_next_dates)} · ${fmtR(K.ev_next_days)} дней</span>
      <div class="grid g3" style="margin-top:14px">
        <div><div class="mini">Цель</div><div class="big num">${fmtM(evT)}</div><div class="mini">${fmtR(K.ev_next_guests_target)} гостей · ${fmtR(K.ev_next_razbor_target)} разбора · ${fmtR(K.ev_next_org_target)} взносов</div></div>
        <div><div class="mini">Собрано</div><div class="big num acc">${fmtM(evC)}</div><div class="mini">${fmtR(K.ev_next_people)} чел.</div></div>
        <div><div class="mini">В счетах, не оплачено</div><div class="big num">${fmtM(evI)}</div><div class="mini">${fmtR(K.ev_next_invoices_n)} счетов · ${fmtR(K.ev_next_invoiced_people)} человек</div></div></div>
      <div class="bar"><i style="width:${pct(evC,evT)}%"></i><b style="left:${pct(evC+evI,evT)}%"></b></div>
      <div class="legend"><span><i style="background:var(--bar-fact)"></i>собрано ${Math.round(pct(evC,evT))} %</span><span><i style="background:var(--accent)"></i>с учётом счетов ${Math.round(pct(evC+evI,evT))} %</span></div>
      <div style="margin-top:14px">${chans||'<div class="empty">Счетов по каналам пока нет</div>'}</div>
      <div class="row"><span class="lbl">Прогноз вклада события при цели</span><span class="val">${fmtM(K.ev_next_contrib_plan)}</span></div></div>
    <div class="card soft"><span class="kick">${esc(K.ev_last_title)} · итог</span>
      <div class="big num">${fmtM(K.ev_last_contrib)}</div><div class="m2" style="margin-top:4px">маржинальный вклад · ${fmtPct(K.ev_last_margin)} от net</div>
      <div class="row" style="margin-top:10px"><span class="lbl">Выручка gross</span><span class="val">${fmtM(K.ev_last_gross)}</span></div>
      <div class="row"><span class="lbl">Участников</span><span class="val">${fmtR(K.ev_last_people)} · ${fmtR(K.ev_last_razbor)} разборов</span></div>
      <div class="row"><span class="lbl">Прямые расходы</span><span class="val">${fmtM(K.ev_last_cost)}</span></div>

  </div>
</section>
<footer class="foot"><span>Источник — финмодель фонда, лист WEB · ${esc(K.feed_version)}</span><span>Доступ — только команда фонда</span></footer>`;
  document.getElementById('loader').style.display='none'; app.style.display='';
  theme(); chart(D);
}

function theme(){
  const b=document.getElementById('theme'), root=document.documentElement; let t='dark';
  try{t=localStorage.getItem('fond-theme')||'dark'}catch(e){}
  const apply=v=>{root.classList.toggle('dark',v==='dark');b.textContent=v==='dark'?'Светлая тема':'Тёмная тема';try{localStorage.setItem('fond-theme',v)}catch(e){}};
  apply(t); b.addEventListener('click',()=>apply(root.classList.contains('dark')?'light':'dark'));
}

function chart(D){
  const K=D.K, fm=num(K.feed_month)||9, M=D.M.slice().sort((a,b)=>a.m-b.m);
  const cum=a=>a.reduce((acc,v)=>{acc.push((acc.length?acc[acc.length-1]:0)+(v||0));return acc},[]);
  const build=(pk,fk)=>{const plan=M.map(r=>r[pk]||0), fact=M.filter(r=>r.m<=fm).map(r=>r[fk]||0);
    const P=cum(plan), F=cum(fact); const FC=cum(fact.concat(plan.slice(fm))).slice(fm-1); return {P,F,FC};};
  const cfg={ebitda:{...build('ep','ef'),kick:'Траектория · EBITDA нарастающим, точка А → точка Б',unit:v=>fmtM(v)},
             rev:{...build('rp','rf'),kick:'Траектория · выручка gross нарастающим, точка А → точка Б',unit:v=>fmtM(v)}};
  const x0=60,x1=1080,y0=250,yTop=90,step=(x1-x0)/11,x=i=>x0+i*step;
  const g=document.getElementById('months'); g.innerHTML='';
  MONTHS.forEach((n,i)=>{const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',x(i));t.setAttribute('y',272);t.setAttribute('text-anchor','middle');t.textContent=n;g.appendChild(t)});
  function draw(m){const d=cfg[m]; const all=d.P.concat(d.F,d.FC); const st=5e6; const lo=Math.floor(Math.min(0,...all)/st)*st, hi=Math.ceil(Math.max(...all)/st)*st; const rng=(hi-lo)||1;
    const y=v=>y0-((v-lo)/rng)*(y0-yTop); const pts=a=>a.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    document.getElementById('plan').setAttribute('points',pts(d.P)); document.getElementById('fact').setAttribute('points',pts(d.F));
    document.getElementById('fc').setAttribute('points',d.FC.map((v,i)=>`${x(fm-1+i)},${y(v)}`).join(' '));
    const i1=fm-1, i0=Math.max(0,i1-2); let p=`M${x(i0)},${y(d.F[i0])}`;
    for(let i=i0;i<=i1;i++) p+=` L${x(i)},${y(d.F[i])}`; for(let i=i1;i>=i0;i--) p+=` L${x(i)},${y(d.P[i])}`;
    document.getElementById('gap').setAttribute('d',p+' Z');
    const A=document.getElementById('dotA');A.setAttribute('cx',x(i1));A.setAttribute('cy',y(d.F[i1]));
    const B=document.getElementById('dotB');B.setAttribute('cx',x(11));B.setAttribute('cy',y(d.P[11]));
    const la=document.getElementById('lblA');la.setAttribute('x',x(i1));la.setAttribute('y',y(d.F[i1])+22);la.textContent='А · '+d.unit(d.F[i1]);
    const lb=document.getElementById('lblB');lb.setAttribute('x',x(11)-10);lb.setAttribute('y',y(d.P[11])-12);lb.textContent='Б · '+d.unit(d.P[11]);
    document.getElementById('ay0').textContent=fmtM(lo).replace(',00',''); document.getElementById('ay1').textContent=fmtM(lo+rng/2).replace(',00',''); document.getElementById('ay2').textContent=fmtM(hi).replace(',00','');
    document.getElementById('chartKick').textContent=d.kick;
    const dev=d.F[i1]-d.P[i1], rest=d.P[11]-d.P[i1], decShare=M[11][m==='ebitda'?'ep':'rp'];
    document.getElementById('chartNote').textContent=`Факт на сегодня — ${d.unit(d.F[i1])} против ${d.unit(d.P[i1])} по плану к концу ${MONTHS[i1]}: ${dev>=0?'опережение':'отставание'} ${fmtM(Math.abs(dev))}. До конца года план добавляет ${fmtM(rest)}; декабрь один даёт ${fmtM(decShare)}.`;
    document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m?'true':'false'));}
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>draw(b.dataset.m)));
  draw('ebitda');
}

function fail(msg){document.getElementById('loader').style.display='none';const e=document.getElementById('err');e.style.display='';e.innerHTML=`<div class="kick acc">Фид не загрузился</div><div style="margin-top:8px">${esc(msg)}</div><div class="note">Проверь, что вкладка WEB опубликована как CSV и версия фида начинается с ${FEED_MIN}.</div>`;}

(async function(){
  try{
    let text;
    if(window.__FEED_CSV__) text=window.__FEED_CSV__;
    else{ const r=await fetch(FEED_URL,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); text=await r.text(); }
    const D=load(parseCSV(text));
    if(!String(D.K.feed_version||'').startsWith(FEED_MIN)) throw new Error('Версия фида «'+(D.K.feed_version||'не указана')+'», страница ждёт '+FEED_MIN);
    render(D);
  }catch(e){fail(e.message);}
})();
</script>
