<script>
/* ════════════════ КОНФИГ ════════════════

const PUB_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQm44TrbgO6MvBJYKetceRUs0agWwmQOdp3QV0Dy4cOfDuX5vhDCKF3spgpVnh2gQ2E5kBOMDjeye08/pub?gid=1081919549&single=true&output=csv';
/* ════════════════════════════════════════ */

const MONTHS = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

// ── Демо-данные (fallback, если фид недоступен; значения v14 на 10.08) ──
const DEMO = {

    vat_payable_year:12191855, fc_gross:78899472, fc_net:64671699, fc_ebitda:29560912,
    fc_np:22170684, fc_cash:34073893, fc_clients:14, fc_deferred:16919517,
  },
  c:[

// ── Утилиты ──
const Nc = n => {
  if(n==null||n===''||(typeof n==='number'&&isNaN(n))) return '—';
  if(typeof n!=='number'){ const x=parseFloat(String(n).replace(/\s/g,'').replace(',','.')); if(isNaN(x)) return '—'; n=x; }
  const a=Math.abs(n), s=n<0?'−':'';
  if(a>=1e9) return s+(a/1e9).toFixed(1).replace('.',',')+' млрд';
  if(a>=1e6) return s+(a/1e6).toFixed(1).replace('.',',')+' млн';
  if(a>=1e3) return s+(a/1e3).toFixed(0)+' тыс';
  return s+Math.round(a);
};
const Nf = n => n==null?'—':new Intl.NumberFormat('ru-RU').format(Math.round(n));
const Pct = n => (n==null||isNaN(n))?'—':(n*100).toFixed(1).replace('.',',')+'%';

// ── Парсер CSV вкладки WEB ──
function splitCSV(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ q=!q; }
    else if(ch===',' && !q){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur); return out;
}
function num(v){
  if(v==null) return null;
  let s=String(v).trim().replace(/"/g,'').replace(/\s/g,'').replace(/\u00a0/g,'');
  if(s==='') return null;
  if(s.endsWith('%')){ const n=parseFloat(s.replace('%','').replace(',','.')); return isNaN(n)?null:n/100; }
  const n=parseFloat(s.replace(',','.')); return isNaN(n)?null:n;
}

function applyAliases(k, eb){
  if(k.ev_date_iso===undefined) k.ev_date_iso='2026-08-25';
  if(k.ev_target===undefined) k.ev_target='4 новых клиента в акселерацию';
  for(let i=1;i<=12;i++){
    const e=eb['m'+i];
    if(k['ebitda_m'+i]===undefined && e!==undefined) k['ebitda_m'+i]=(e&&e.plan!=null)?e.plan:e;
  }
  return k;
}

function parseFeed(txt){
  const k={}, c=[], p=[], ev=[], rec=[], eb={}, rv={}; let pt=null, recTL=[];
  txt.trim().split(/\r?\n/).forEach(line=>{
    const f=splitCSV(line); const tag=(f[0]||'').trim();
    if(tag==='K'){ const key=(f[1]||'').trim(); const raw=(f[2]||'').trim().replace(/"/g,'');
      if(key.endsWith('_label')||key.endsWith('_title')||key.endsWith('_dates')||key.endsWith('_iso')||key.endsWith('_target')||key.endsWith('_asof')||key.endsWith('_venue')){ k[key]=raw; }
      else { const nv=num(raw); k[key]=(nv==null?0:nv); } }
    else if(tag==='C'){ c.push([f[1],f[2],f[3],f[4]].map(x=>(x||'').trim().replace(/"/g,''))); }
    else if(tag==='P'){ p.push([(f[1]||'').trim().replace(/"/g,''),...f.slice(2,15).map(num)]); }
    else if(tag==='PT'){ pt=[(f[1]||'').trim(),...f.slice(2,15).map(num)]; }
    else if(tag==='EV'){ ev.push({name:(f[1]||'').trim().replace(/"/g,''),n:num(f[2])||0,rev:num(f[3])||0,
      price:(f[4]||'').trim().replace(/"/g,''),role:(f[5]||'').trim().replace(/"/g,'')}); }
    else if(tag==='R' || tag==='RC'){ rec.push({name:(f[1]||'').trim().replace(/"/g,''),cf:num(f[2])||0,pl:num(f[3])||0,def:num(f[4]),pct:num(f[5])}); }
    else if(tag==='RT'){ recTL=f.slice(1,8).map(x=>num(x)||0); }
    else if(tag==='EB'){ const key=(f[1]||'').trim(); eb[key]={plan:num(f[2]),fact:num(f[3])}; }
    else if(tag==='RV'){ const key=(f[1]||'').trim(); rv[key]={plan:num(f[2]),fact:num(f[3])}; }
  });
  applyAliases(k, eb);
  return {k,c,p,pt,ev,rec,recTL,eb,rv};
}

async function loadData(){
  if(!PUB_CSV_URL) return {d:DEMO, demo:true, err:null};
  try{
    const r=await fetch(PUB_CSV_URL+(PUB_CSV_URL.includes('?')?'&':'?')+'cb='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const txt=await r.text();
    if(txt.includes('<!DOCTYPE')||txt.includes('<html')) throw new Error('лист не опубликован');
    const d=parseFeed(txt);
    if(d.k.gross_plan==null) throw new Error('данные не распознаны');
    return {d, demo:false, err:null};
  }catch(e){ return {d:DEMO, demo:true, err:e.message}; }
}

// ── Рендер ──
function kpiPF(label, plan, fact, vc, ac, note){
  const pct = (plan!=null && plan!==0) ? fact/plan : null;
  const w = pct!=null ? Math.max(0,Math.min(100,pct*100)) : 0;
  const factCol = (fact!=null && fact<0) ? ' style="color:var(--mag)"' : '';
  const pctCol  = (pct!=null && pct<0)   ? ' style="color:var(--mag)"' : ' style="color:var(--cyan)"';
  return `<div class="kpi ${ac}">
    <div class="kpi-lbl">${label}</div>
    <div class="kpi-vlbl">план год</div>
    <div class="kpi-val ${vc}">${Nc(plan)} ₽</div>
    <div class="kpi-rows">
      <div class="kr"><span>Факт YTD</span><b${factCol}>${Nc(fact)} ₽</b></div>
      <div class="kr pct"><span>% выполнения</span><b${pctCol}>${Pct(pct)}</b></div>
    </div>
    <div class="kpi-bar"><div class="kpi-fill" style="width:${w}%"></div></div>
    ${note?`<div class="kpi-note">${note}</div>`:''}
  </div>`;
}
function statusClass(s){
  if(/Пауза|⏸/.test(s)) return 'muted';
  if(/Счёт|⚠/.test(s)) return 'warn';
  if(/Нов|☆/.test(s)) return 'cyan';
  if(/DD|⟳/.test(s)) return 'violet';
  return 'green';
}

const EV_COLORS={cyan:'#00D4FF',mag:'#FF2D78',green:'#00E5A0'};
function daysUntil(iso){
  if(!iso) return null;
  const t=new Date(iso+'T00:00:00'); if(isNaN(t)) return null;
  return Math.ceil((t-new Date())/86400000);
}
function buildEvent(d){
  const k=d.k;
  const streams=(d.ev&&d.ev.length?d.ev:[]).map((e,i)=>({...e,color:['mag','cyan','green'][i]||'cyan'}));
  const cd=(k.mm_days_left!=null && !isNaN(k.mm_days_left) && k.mm_days_left>0)?k.mm_days_left:daysUntil(k.ev_date_iso);
  const cal='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
  const cdTxt = cd==null?'' : (cd>0?`через ${cd} дн.`:(cd>-7?'идёт сейчас':''));
  const segs=streams.map(s=>{
    const c=EV_COLORS[s.color]||'#00D4FF';
    return `<div class="ev-seg" style="flex:${s.n};background:linear-gradient(135deg,${c},${c}cc)">
      <div class="n">${s.n}</div><div class="t">${s.name.split(' ')[0]}</div></div>`;
  }).join('');
  const cards=streams.map(s=>{
    const c=EV_COLORS[s.color]||'#00D4FF';
    return `<div class="ev-stream" style="border-top-color:${c}">
      <div class="ev-s-n" style="color:${c}">${s.n}</div>
      <div class="ev-s-name">${s.name}</div>
      <div class="ev-s-price">${s.price}</div>
      <div class="ev-s-rev">${Nc(s.rev)} ₽ оплачено</div>
      <div class="ev-s-role">${s.role}</div></div>`;
  }).join('');
  const pplPct=(k.mm_people_plan? k.mm_people_fact/k.mm_people_plan : null);
  const revPct=(k.mm_rev_pct!=null? k.mm_rev_pct : (k.mm_rev_plan? k.mm_rev_fact/k.mm_rev_plan : null));
  const w=revPct!=null?Math.max(0,Math.min(100,revPct*100)):0;
  return `<div class="sec">Августовский мастермайнд · воронка события</div>
  <div class="ev-card">
    <div class="ev-top">
      <div>
        <div class="ev-title-row"><div class="ev-name">${k.mm_title||'ММ Фонда'}</div>${cdTxt?`<span class="ev-cd">${cdTxt}</span>`:''}</div>
        <div class="ev-dates">${cal}${k.mm_dates||''}</div>
        <div class="ev-frame">${k.mm_venue||'Мастермайнд — ключевая точка конверсии воронки фонда'}</div>
      </div>
      <div class="ev-metrics">
        <div><div class="ev-m-l">участников · цель ${k.mm_people_plan??'—'}</div>
          <div class="ev-m-v">${k.mm_people_fact??'—'} <span style="font-size:12px;color:${pplPct>=1?'var(--green)':'var(--gold)'}">${Pct(pplPct)}</span></div></div>
        <div><div class="ev-m-l">собрано · цель ${Nc(k.mm_rev_plan)} ₽</div>
          <div class="ev-m-v" style="color:var(--cyan)">${Nc(k.mm_rev_fact)} ₽ <span style="font-size:12px;color:var(--gold)">${Pct(revPct)}</span></div></div>
      </div>
    </div>
    <div class="kpi-bar" style="margin:0 0 16px"><div class="kpi-fill" style="width:${w}%"></div></div>
    <div class="ev-bar">${segs}</div>
    <div class="ev-streams">${cards}</div>
    <div class="ev-foot">
      <span class="efl">Цель события:</span><span class="ev-goal">${k.ev_target||''}</span>
      <span class="efl" style="margin-left:auto">К получению (счета + предоплаты):</span>
      <span style="font-family:'DM Mono',monospace;color:var(--gold)">${Nc(k.mm_debt)} ₽</span>
    </div>
  </div>`;
}

function buildRec(d){
  const k=d.k;
  const clients=d.rec&&d.rec.length?d.rec:[];
  const cf=clients.reduce((s,x)=>s+x.cf,0);
  const pl=clients.reduce((s,x)=>s+x.pl,0);
  const mm=k.rec_deferred_mm, total=(k.rec_deferred_total!=null?k.rec_deferred_total:(cf-pl)+(mm||0));
  const rows=clients.map(c=>{
    const def=(c.def!=null && !isNaN(c.def)) ? c.def : (c.cf-c.pl);
    const pct=(c.pct!=null && !isNaN(c.pct)) ? c.pct : (c.cf?c.pl/c.cf:0);
    const debt = def < 0;
    const w = Math.min(100, Math.round(pct*100));
    const right = debt
      ? `<div class="recr-def debt"><span>долг</span><b>${Nc(Math.abs(def))} ₽</b></div>`
      : `<div class="recr-def"><span>отложено</span><b>${Nc(def)} ₽</b></div>`;
    return `<div class="recr">
      <div class="recr-name">${c.name}</div>
      <div class="recr-mid">
        <div class="recr-bar"><div class="recr-fill${debt?' debt':''}" style="width:${w}%"></div></div>
        <div class="recr-pct${debt?' debt':''}">${Math.round(pct*100)}%</div>
      </div>
      ${right}
    </div>`;
  }).join('');
  const mmRow = (mm!=null && mm>0)?`
    <div class="recr" style="border-top:1px solid rgba(255,255,255,.08)">
      <div class="recr-name" style="font-weight:600;color:var(--gold)">Авансы августовского ММ</div>
      <div class="recr-mid">
        <div class="recr-bar"><div class="recr-fill" style="width:0%"></div></div>
        <div class="recr-pct" style="color:var(--muted)">0%</div>
      </div>
      <div class="recr-def"><span>отложено</span><b>${Nc(mm)} ₽</b></div>
    </div>`:'';
  return `<div class="sec">Признание выручки · метод начисления · ${k.rec_asof||''}</div>
  <div class="card rec-card">
    <div class="rec-flow">
      <div class="rec-stat"><div class="rec-l">Поступило по акселерации</div><div class="rec-v v-c">${Nc(cf)} ₽</div></div>
      <span class="rec-arrow">→</span>
      <div class="rec-stat"><div class="rec-l">Отработано (услуга оказана)</div><div class="rec-v v-gn">${Nc(pl)} ₽</div></div>
      <span class="rec-arrow">→</span>
      <div class="rec-stat hl"><div class="rec-l">Отложено всего · акс + авансы ММ</div><div class="rec-v v-go">${Nc(total)} ₽</div></div>
    </div>
    <div class="rec-clients">${rows}${mmRow}</div>
    <div class="rec-note">Оценка: снимок Натальи на 30.06 + фактические платежи и линейное признание по 10.08. Точный срез начисления — за Натальей (заменит оценку).
    Авансы ММ признаются выручкой после проведения события 25–30.08. Долг — признание опередило оплату (закрывается следующим платежом).</div>
  </div>`;
}

let chartM=null;
function buildChart(k, eb){
  if(chartM){chartM.destroy();chartM=null;}
  const cm=document.getElementById('cm'); if(!cm) return;
  const plan=[], fact=[];
  for(let i=1;i<=12;i++){
    const e=eb['m'+i];
    if(e && typeof e==='object'){ plan.push(e.plan??0); fact.push(e.fact); }
    else { plan.push(k['ebitda_m'+i]??0); fact.push(null); }
  }
  let lastF=-1; fact.forEach((v,i)=>{ if(v!=null && v!==0) lastF=i; });
  const factCut=fact.map((v,i)=> i<=lastF ? v : null);
  const grid='rgba(255,255,255,0.05)', tick={color:'#4A6080',font:{size:10,family:"'DM Mono',monospace"}};
  chartM=new Chart(cm,{type:'bar',
    data:{labels:MONTHS,datasets:[
      {label:'План',data:plan,borderRadius:3,
       backgroundColor:plan.map(v=>v>=0?'rgba(0,229,160,0.22)':'rgba(255,45,120,0.22)')},
      {label:'Факт',data:factCut,borderRadius:3,
       backgroundColor:factCut.map(v=>(v??0)>=0?'rgba(0,229,160,0.9)':'rgba(255,45,120,0.9)')}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,labels:{color:'#4A6080',font:{size:10},boxWidth:10}},
      tooltip:{callbacks:{label:c=>c.dataset.label+': '+Nc(c.raw)+' ₽'}}},
      scales:{x:{grid:{color:grid},ticks:tick},y:{grid:{color:grid},ticks:{...tick,callback:v=>Nc(v)}}}}});
}

async function init(){
  document.getElementById('loader').style.display='flex';

  const {d,demo,err}=await loadData();
  const time=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});

  render(d,demo,err,time);
}
init();
