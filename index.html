<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фонд-Акселератор МД — Дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ═══════════ ТЕМЫ ═══════════ */
[data-theme="dark"]{
  --navy:#0A1628; --navy-rgb:10,22,40;
  --cyan:#00D4FF; --cyan-rgb:0,212,255;
  --mag:#FF2D78;  --mag-rgb:255,45,120;
  --gold:#FFB547; --gold-rgb:255,181,71;
  --green:#00E5A0;--green-rgb:0,229,160;
  --violet:#9D7BFF;--violet-rgb:157,123,255;
  --white:#F0F4FF; --muted:#7C93AE;
  --glass:rgba(255,255,255,0.04);
  --surface2:rgba(255,255,255,0.02);
  --border:rgba(255,255,255,0.07);
  --border-soft:rgba(255,255,255,0.05);
  --track:rgba(255,255,255,0.07);
  --chip-mut:rgba(255,255,255,0.05);
  --code-bg:rgba(0,0,0,.25);
  --on-accent:#0A1628;
  --gold-txt:#FFB547;
  --tip-bg:#04101F;
}
[data-theme="light"]{
  --navy:#FAFAF7; --navy-rgb:250,250,247;
  --cyan:#1C4A43; --cyan-rgb:28,74,67;
  --mag:#9C3B2E;  --mag-rgb:156,59,46;
  --gold:#B9794B; --gold-rgb:185,121,75;
  --green:#4E7F70;--green-rgb:78,127,112;
  --violet:#5B6B8A;--violet-rgb:91,107,138;
  --white:#16191B; --muted:#74776E;
  --glass:#FFFFFF;
  --surface2:#FCFCFA;
  --border:#E7E5DD;
  --border-soft:#EFEDE6;
  --track:#DAD8CE;
  --chip-mut:#F2F1EB;
  --code-bg:rgba(0,0,0,.06);
  --on-accent:#FFFFFF;
  --gold-txt:#8E5B33;
  --tip-bg:#16191B;
}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}

html,body{background:var(--navy);color:var(--white);font-family:'Inter',sans-serif;min-height:100vh}
body{padding:24px 20px 60px;transition:background .25s ease,color .25s ease}
.wrap{max-width:1400px;margin:0 auto}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}

.hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;margin-bottom:26px;
     border-bottom:1px solid rgba(var(--cyan-rgb),0.14);flex-wrap:wrap;gap:12px}
.hdr-l{display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;border-radius:11px;flex-shrink:0;background:linear-gradient(135deg,var(--cyan),var(--mag));
      display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--on-accent)}
.hdr-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:3px}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-family:'DM Mono',monospace;font-size:11px;color:var(--cyan);background:rgba(var(--cyan-rgb),0.08);
       border:1px solid rgba(var(--cyan-rgb),0.2);padding:5px 11px;border-radius:18px}
.badge.demo{color:var(--gold-txt);background:rgba(var(--gold-rgb),0.08);border-color:rgba(var(--gold-rgb),0.28)}
.badge.err{color:var(--mag);background:rgba(var(--mag-rgb),0.08);border-color:rgba(var(--mag-rgb),0.28)}
.btn{background:rgba(var(--cyan-rgb),0.08);border:1px solid rgba(var(--cyan-rgb),0.2);color:var(--cyan);padding:5px 13px;
     border-radius:18px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:.2s}
.btn:hover{background:rgba(var(--cyan-rgb),0.18)}

.sec{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
     margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--border-soft)}

.pills{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:22px;font-size:12px;font-weight:500;border:1px solid}
.pill.g{background:rgba(var(--green-rgb),.07);border-color:rgba(var(--green-rgb),.24);color:var(--green)}
.pill.y{background:rgba(var(--gold-rgb),.07);border-color:rgba(var(--gold-rgb),.24);color:var(--gold-txt)}
.pill.c{background:rgba(var(--cyan-rgb),.07);border-color:rgba(var(--cyan-rgb),.24);color:var(--cyan)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pills-note{font-size:11px;color:var(--muted);margin-bottom:28px}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:12px}
.kpi{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;transition:.2s}
.kpi:hover{border-color:rgba(var(--cyan-rgb),.28);transform:translateY(-2px)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gl,rgba(var(--cyan-rgb),.5)),transparent)}
.kpi.c{--gl:rgba(var(--cyan-rgb),.6)}.kpi.m{--gl:rgba(var(--mag-rgb),.6)}.kpi.gn{--gl:rgba(var(--green-rgb),.6)}
.kpi-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kpi-val{font-family:'DM Mono',monospace;font-size:23px;font-weight:500;line-height:1}
.v-c{color:var(--cyan)}.v-m{color:var(--mag)}.v-gn{color:var(--green)}.v-w{color:var(--white)}
.kpi-vlbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.kpi-rows{margin-top:10px;border-top:1px solid var(--border-soft);padding-top:9px}
.kr{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--muted);padding:2px 0}
.kr b{font-family:'DM Mono',monospace;font-weight:500;font-size:12px;color:var(--white)}
.kr.pct b{font-size:13px}
.kpi-bar{height:4px;background:var(--track);border-radius:3px;margin-top:10px;overflow:hidden}
.kpi-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--mag));transition:width 1s ease}
.kpi-note{font-size:10px;color:var(--muted);margin-top:9px;line-height:1.4}
.recalc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:28px;
        border-left:2px solid rgba(var(--gold-rgb),.6);padding-left:12px}
.recalc b{color:var(--white)}

/* ═══════════ СОБЫТИЕ: ЗАПОЛНЯЕМОСТЬ ═══════════ */
.ev-card{background:linear-gradient(135deg,rgba(var(--cyan-rgb),.07),rgba(var(--mag-rgb),.04));
  border:1px solid rgba(var(--cyan-rgb),.22);border-radius:16px;padding:22px 24px;margin-bottom:28px}
.ev-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.ev-title-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.ev-name{font-family:'Syne',sans-serif;font-size:20px;font-weight:800}
.ev-cd{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold-txt);background:rgba(var(--gold-rgb),.1);
  border:1px solid rgba(var(--gold-rgb),.3);padding:3px 10px;border-radius:14px}
.ev-dates{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--white);margin-bottom:6px}
.ev-dates svg{opacity:.65}
.ev-frame{font-size:11px;color:var(--muted)}
.ev-metrics{display:flex;gap:26px;text-align:right;flex-wrap:wrap}
.ev-m-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ev-m-v{font-family:'DM Mono',monospace;font-size:19px;margin-top:4px}

/* деньги события */
.ev-money{margin-bottom:20px}
.ev-money-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.ev-money-big{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:var(--cyan)}
.ev-money-of{font-size:12px;color:var(--muted)}
.ev-money-pct{font-family:'DM Mono',monospace;font-size:15px;color:var(--white)}
.ev-track{height:8px;background:var(--track);border-radius:5px;overflow:hidden}
.ev-track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cyan),var(--mag));
  transform-origin:left;animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{from{transform:scaleX(.001)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.ev-track i{animation:none}}

/* три потока: факт / план */
.ev-streams{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.ev-streams{grid-template-columns:1fr}.ev-metrics{gap:18px}}
.ev-stream{background:var(--glass);border:1px solid var(--border);border-top:2px solid var(--cyan);border-radius:12px;padding:15px 16px}
.ev-s-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ev-s-n{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;line-height:1}
.ev-s-plan{font-family:'DM Mono',monospace;font-size:14px;color:var(--muted)}
.ev-s-name{font-size:12px;font-weight:600;margin-top:7px}
.ev-s-price{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-top:3px}
.ev-s-track{height:5px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:11px}
.ev-s-track i{display:block;height:100%;border-radius:3px}
.ev-s-rev{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:12px;margin-top:9px}
.ev-s-rev b{font-weight:500;color:var(--green)}
.ev-s-rev span{color:var(--muted)}
.ev-s-role{font-size:10px;color:var(--muted);margin-top:9px;line-height:1.45;border-top:1px solid var(--border-soft);padding-top:8px}

.ev-foot{display:flex;align-items:center;gap:10px 22px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--border);font-size:12px;flex-wrap:wrap}
.ev-foot .efl{color:var(--muted)}
.ev-foot b{font-family:'DM Mono',monospace;font-weight:500}
.ev-goal{font-weight:600;color:var(--gold-txt);background:rgba(var(--gold-rgb),.08);
  border:1px solid rgba(var(--gold-rgb),.24);padding:3px 11px;border-radius:14px}
.ev-debt{color:var(--mag)}

.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:760px){.opt-grid{grid-template-columns:1fr}}
.opt{background:linear-gradient(135deg,rgba(var(--green-rgb),.06),rgba(var(--cyan-rgb),.03));
     border:1px solid rgba(var(--green-rgb),.2);border-radius:14px;padding:20px 22px}
.opt.warn{background:linear-gradient(135deg,rgba(var(--gold-rgb),.06),rgba(var(--mag-rgb),.03));
     border-color:rgba(var(--gold-rgb),.24)}
.opt-t{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:14px}
.opt-flow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.opt-from,.opt-to{font-family:'DM Mono',monospace;font-size:18px}
.opt-from{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(var(--mag-rgb),.6)}
.opt-to{color:var(--green);font-size:21px}
.opt-arrow{color:var(--cyan);font-size:16px}
.opt-big{font-family:'DM Mono',monospace;font-size:26px;color:var(--gold-txt)}
.opt-save{margin-top:12px;font-size:12px;color:var(--green);font-weight:600}
.opt-save.neg{color:var(--gold-txt)}
.opt-note{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.5}

.charts-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:28px}
.card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:22px}
.card-t{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:16px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.legend div{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.sw{width:15px;height:9px;border-radius:2px;flex:none}
.sw.plan{background:var(--track)} .sw.fact{background:var(--cyan)} .sw.eb{height:2px;background:var(--gold);width:17px}
.chart-box{position:relative;height:280px;width:100%}
.chart-fallback{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;
  color:var(--muted);font-size:12px;padding:0 20px;line-height:1.6}

.bot-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:14px}
@media(max-width:900px){.bot-grid{grid-template-columns:1fr}}
.rec-flow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.rec-stat{flex:1;min-width:150px}
.rec-stat.hl{background:rgba(var(--gold-rgb),.07);border:1px solid rgba(var(--gold-rgb),.24);border-radius:10px;padding:10px 14px;flex:0 0 auto}
.rec-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rec-v{font-family:'DM Mono',monospace;font-size:20px;margin-top:5px}
.rec-arrow{color:var(--cyan);font-size:18px;flex:0 0 auto}
@media(max-width:620px){.rec-arrow{display:none}.rec-stat{min-width:100%}}
.rec-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:4px}
.recr{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--border-soft)}
.recr:last-child{border-bottom:none}
.recr-name{width:210px;flex-shrink:0;font-size:12px;font-weight:500;overflow-wrap:anywhere}
.recr-mid{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
.recr-bar{flex:1;height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.recr-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width 1s ease}
.recr-pct{font-family:'DM Mono',monospace;font-size:11px;color:var(--green);width:38px;text-align:right}
.recr-def{display:flex;flex-direction:column;align-items:flex-end;width:130px;flex-shrink:0}
.recr-def span{font-size:9px;color:var(--muted);text-transform:uppercase}
.recr-def b{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold-txt);font-weight:500}
@media(max-width:620px){.recr-name{width:130px}.recr-def{width:90px}}

.cr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-soft)}
.cr:last-child{border-bottom:none}
.cr.paused{opacity:.48}
.cr-l{display:flex;flex-direction:column;gap:3px}
.cr-name{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.cr-trk{font-size:10px;color:var(--muted)}
.cr-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ct{font-size:10px;padding:3px 9px;border-radius:9px;font-weight:500;white-space:nowrap}
.ct.green{background:rgba(var(--green-rgb),.12);color:var(--green)}
.ct.warn{background:rgba(var(--gold-rgb),.14);color:var(--gold-txt)}
.ct.cyan{background:rgba(var(--cyan-rgb),.12);color:var(--cyan)}
.ct.violet{background:rgba(var(--violet-rgb),.14);color:var(--violet)}
.ct.muted{background:var(--chip-mut);color:var(--muted)}
.cr-next{font-size:10px;color:var(--muted)}

.acc-item{border:1px solid var(--border);border-radius:11px;margin-bottom:8px;overflow:hidden;transition:.2s}
.acc-item:hover{border-color:rgba(var(--cyan-rgb),.24)}
.acc-item.off{opacity:.55}
.acc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;cursor:pointer;
  user-select:none;background:none;border:0;width:100%;text-align:left;color:var(--white);font-family:'Inter',sans-serif}
.acc-head:hover{background:rgba(var(--cyan-rgb),.04)}
.acc-name{font-size:12px;font-weight:500;display:flex;align-items:center;gap:9px;overflow-wrap:anywhere}
.acc-chev{color:var(--muted);font-size:11px;transition:transform .25s;flex:none}
.acc-head[aria-expanded="true"] .acc-chev{transform:rotate(90deg)}
.acc-tot{font-family:'DM Mono',monospace;font-size:12px;color:var(--cyan);flex:none}
.acc-item.off .acc-tot{color:var(--muted)}
.off-tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--track);border-radius:9px;padding:2px 7px}
.acc-body{display:none;padding:0}
.acc-body.open{display:block}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px 16px 16px}
@media(max-width:520px){.months{grid-template-columns:repeat(4,1fr)}}
.mcell{border-radius:7px;padding:7px 4px;text-align:center;background:var(--surface2);border:1px solid transparent}
.mcell.paid{background:rgba(var(--cyan-rgb),.1);border-color:rgba(var(--cyan-rgb),.24)}
.mcell-m{font-size:9px;color:var(--muted);text-transform:uppercase}
.mcell-v{font-family:'DM Mono',monospace;font-size:10px;margin-top:3px;color:var(--muted)}
.mcell.paid .mcell-v{color:var(--cyan)}
.pt-row{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;font-size:12px;gap:10px;flex-wrap:wrap}
.pt-row span:first-child{color:var(--muted)}
.pt-row span:last-child{font-family:'DM Mono',monospace;color:var(--cyan)}

.info{background:rgba(var(--gold-rgb),.08);border:1px solid rgba(var(--gold-rgb),.24);border-radius:10px;padding:14px 16px;
      margin-bottom:20px;font-size:12px;color:var(--gold-txt);line-height:1.6}
.info code{background:var(--code-bg);padding:1px 6px;border-radius:4px;font-size:11px}
.info a{color:var(--cyan);text-decoration:none}

.ftr{margin-top:40px;padding-top:18px;border-top:1px solid var(--border-soft);display:flex;justify-content:space-between;
     font-size:11px;color:var(--muted);flex-wrap:wrap;gap:8px}
.ftr a{color:var(--cyan);text-decoration:none}

#loader{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:14px}
.spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(var(--cyan-rgb),.2);border-top-color:var(--cyan);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loader"><div class="spin"></div><span style="color:var(--muted);font-size:13px">Загрузка данных...</span></div>
  <div id="app" style="display:none"></div>
</div>
<script>
/* ════════════════ КОНФИГ ════════════════
   Опубликованный CSV вкладки WEB.
   Файл → Поделиться → Опубликовать в интернете → лист WEB → CSV.  */
const PUB_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQm44TrbgO6MvBJYKetceRUs0agWwmQOdp3QV0Dy4cOfDuX5vhDCKF3spgpVnh2gQ2E5kBOMDjeye08/pub?gid=247575935&single=true&output=csv';
/* ════════════════════════════════════════ */

/* ── тема: тёмная по умолчанию, светлая — опция для МД ── */
const THEME_KEY='fond_dash_theme';
function getTheme(){ try{const t=localStorage.getItem(THEME_KEY); if(t==='light'||t==='dark') return t;}catch(e){} return 'dark'; }
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem(THEME_KEY,t);}catch(e){}
  const b=document.getElementById('themeBtn');
  if(b){ b.textContent = t==='dark' ? '☀ Светлая' : '☾ Тёмная';
         b.setAttribute('aria-label', t==='dark'?'Включить светлую тему':'Включить тёмную тему'); }
  if(window.__d) requestAnimationFrame(()=>buildChart(window.__d));
}
function toggleTheme(){ applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); }
applyTheme(getTheme());

const MONTHS = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

/* ── утилиты ── */
const SP = /[\s\u00A0\u202F\u2009]/g;
function num(v){
  if(v==null) return null;
  if(typeof v==='number') return isNaN(v)?null:v;
  let s=String(v).trim().replace(/^"|"$/g,'').replace(/₽/g,'');
  if(!s||s==='—'||s==='-') return null;
  const pct=s.endsWith('%'); if(pct) s=s.slice(0,-1);
  s=s.replace(SP,'').replace('−','-');
  if(s.includes(',')&&s.includes('.')) s=s.replace(/,/g,'');
  else if((s.match(/,/g)||[]).length===1 && /,\d{1,2}$/.test(s)) s=s.replace(',','.');
  else s=s.replace(/,/g,'');
  const n=parseFloat(s);
  if(isNaN(n)) return null;
  return pct?n/100:n;
}
const Nc = v => {
  const n=num(v); if(n==null) return '—';
  const a=Math.abs(n), s=n<0?'−':'';
  if(a>=1e9) return s+(a/1e9).toFixed(1).replace('.',',')+' млрд';
  if(a>=1e6) return s+(a/1e6).toFixed(1).replace('.',',')+' млн';
  if(a>=1e3) return s+Math.round(a/1e3)+' тыс';
  return s+Math.round(a);
};
const Nf = v => { const n=num(v); return n==null?'—':new Intl.NumberFormat('ru-RU').format(Math.round(n)); };
const Pct = n => (n==null||isNaN(n))?'—':(n*100).toFixed(1).replace('.',',')+'%';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function splitCSV(line){
  const out=[]; let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===','&&!q){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur); return out;
}
const TEXT_KEYS=new Set(['updated_label','month_label','mm_title','mm_dates','mm_venue','rec_asof']);

function parseFeed(txt){
  const k={},c=[],p=[],ev=[],rv=[],eb=[],rec=[]; let pt=null;
  txt.trim().split(/\r?\n/).forEach(line=>{
    const f=splitCSV(line).map(x=>x.trim().replace(/^"|"$/g,''));
    const tag=(f[0]||'').trim();
    if(tag==='K'){ const key=f[1]; if(key) k[key]=TEXT_KEYS.has(key)?f[2]:(num(f[2])??0); }
    else if(tag==='C'){ if(f[1]) c.push([f[1],f[2],f[3],f[4]]); }
    else if(tag==='P'){ if(f[1]) p.push([f[1],...f.slice(2,14).map(num),num(f[14]),num(f[15])]); }
    else if(tag==='PT'){ pt=['ИТОГО',...f.slice(2,14).map(num),num(f[14])]; }
    else if(tag==='RV'){ rv.push([num(f[2]),num(f[3])]); }
    else if(tag==='EB'){ eb.push([num(f[2]),num(f[3])]); }
    else if(tag==='EV'){ if(f[1]) ev.push([f[1],num(f[2]),num(f[3]),f[4],f[5]]); }
    else if(tag==='R'){ if(f[1]) rec.push({name:f[1],cf:num(f[2])||0,pl:num(f[3])||0}); }
  });
  return {k,c,p,pt,rv,eb,ev,rec};
}

async function loadData(){
  if(!PUB_CSV_URL) return {d:DEMO,demo:true,err:null};
  try{
    const r=await fetch(PUB_CSV_URL+(PUB_CSV_URL.includes('?')?'&':'?')+'cb='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const txt=await r.text();
    if(txt.includes('<!DOCTYPE')||txt.includes('<html')) throw new Error('лист не опубликован');
    const d=parseFeed(txt);
    if(!d.k.gross_plan) throw new Error('данные не распознаны');
    return {d,demo:false,err:null};
  }catch(e){ return {d:DEMO,demo:true,err:e.message}; }
}

/* ── KPI ── */
function kpiPF(label,plan,fact,vc,ac,note){
  const pct=(plan!=null&&plan!==0)?fact/plan:null;
  const w=pct!=null?Math.max(0,Math.min(100,pct*100)):0;
  const factCol=(fact!=null&&fact<0)?' style="color:var(--mag)"':'';
  const pctCol =(pct!=null&&pct<0) ?' style="color:var(--mag)"':' style="color:var(--cyan)"';
  return `<div class="kpi ${ac}">
    <div class="kpi-lbl">${esc(label)}</div>
    <div class="kpi-vlbl">план год</div>
    <div class="kpi-val ${vc}">${Nc(plan)} ₽</div>
    <div class="kpi-rows">
      <div class="kr"><span>Факт YTD</span><b${factCol}>${Nc(fact)} ₽</b></div>
      <div class="kr pct"><span>% выполнения</span><b${pctCol}>${Pct(pct)}</b></div>
    </div>
    <div class="kpi-bar"><div class="kpi-fill" style="width:${w}%"></div></div>
    ${note?`<div class="kpi-note">${note}</div>`:''}
  </div>`;
}
function statusClass(s){
  s=String(s||'');
  if(/Пауза|⏸/.test(s)) return 'muted';
  if(/Счёт|Ожидаем|⚠/.test(s)) return 'warn';
  if(/Нов|☆/.test(s)) return 'cyan';
  if(/DD|⟳/.test(s)) return 'violet';
  return 'green';
}

  const cf  = rich ? d.rec.reduce((s,x)=>s+x.cf,0) : null;
  const pl  = rich ? d.rec.reduce((s,x)=>s+x.pl,0) : null;
  const rows = rich ? d.rec.map(c=>{
      const def=c.cf-c.pl, pct=c.cf?c.pl/c.cf:0;
      return `<div class="recr">
        <div class="recr-name">${esc(c.name)}</div>
        <div class="recr-mid"><div class="recr-bar"><div class="recr-fill" style="width:${Math.round(pct*100)}%"></div></div>
          <div class="recr-pct">${Math.round(pct*100)}%</div></div>
        <div class="recr-def"><span>отложено</span><b>${Nc(def)} ₽</b></div>

  return `<div class="sec">Признание выручки · ${esc(k.rec_asof||'')}</div>
  <div class="card">

      <div class="rec-stat"><div class="rec-l">Отложено по акселерации</div>

/* ── график ── */
let chart=null;
function buildChart(d){
  const el=document.getElementById('cm'); if(!el) return;
  const box=el.closest('.chart-box');
  if(typeof Chart==='undefined'||!d.rv||!d.rv.length||!d.eb||!d.eb.length){
    box.innerHTML='<div class="chart-fallback">График недоступен: не загрузилась Chart.js или в фиде нет строк RV / EB.</div>';
    return;
  }
  if(chart){chart.destroy();chart=null;}
  if(!box.querySelector('canvas')) box.innerHTML='<canvas id="cm"></canvas>';
  const cv=document.getElementById('cm');

  const css=getComputedStyle(document.documentElement);
  const V=n=>css.getPropertyValue(n).trim();
  const rgba=(n,a)=>`rgba(${V(n)},${a})`;
  const cyan=V('--cyan'), gold=V('--gold'), track=V('--track'), muted=V('--muted'),
        tipBg=V('--tip-bg'), navy=V('--navy'), fg=V('--white');
  const font={size:10,family:"'DM Mono',monospace"};

  const rvP=d.rv.map(x=>x[0]??0), rvF=d.rv.map(x=>x[1]), ebF=d.eb.map(x=>x[1]);

  chart=new Chart(cv,{data:{labels:MONTHS,datasets:[
      {type:'bar',label:'Выручка, план',data:rvP,backgroundColor:track,borderRadius:3,order:3,
       barPercentage:.9,categoryPercentage:.8},
      {type:'bar',label:'Выручка, факт',data:rvF,backgroundColor:cyan,borderRadius:3,order:2,
       barPercentage:.52,categoryPercentage:.8},
      {type:'line',label:'EBITDA, факт',data:ebF,borderColor:gold,backgroundColor:gold,borderWidth:2,
       pointRadius:3,pointBackgroundColor:navy,pointBorderColor:gold,tension:.25,order:1,spanGaps:false},
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},
        tooltip:{backgroundColor:tipBg,titleColor:fg,bodyColor:fg,borderColor:rgba('--cyan-rgb',.3),borderWidth:1,
          padding:12,cornerRadius:8,titleFont:font,bodyFont:font,
          callbacks:{label:c=>c.raw==null?null:` ${c.dataset.label}: ${Nf(c.raw)} ₽`}}},
      scales:{x:{grid:{display:false},border:{color:rgba('--cyan-rgb',.15)},ticks:{color:muted,font}},
              y:{grid:{color:rgba('--cyan-rgb',.07)},border:{display:false},
                 ticks:{color:muted,font,callback:v=>Nc(v)}}}}});
}

      ${kpiPF('Выручка NET / год',k.net_plan,k.net_fact,'v-w','c')}
      ${kpiPF('EBITDA / год',k.ebitda_plan,k.ebitda_fact,'v-gn','gn','Рентабельность: план '+Pct(k.ebitda_margin_plan)+' · факт '+Pct(k.ebitda_margin_fact))}
      ${kpiPF('Чистая прибыль / год',k.np_plan,k.np_fact,'v-gn','gn','Рентабельность ЧП (план): '+Pct(k.np_margin_plan))}
      ${kpiPF('Акселерация / год',k.aks_plan,k.aks_fact,'v-c','c')}
      ${kpiPF('ММ-события / год',k.mm_plan,k.mm_fact,'v-m','m','Ближайшее событие — август 2026')}
    </div>
    <div class="recalc"><b>Пересчитано 10.07.2026.</b> В фактических расходах июня и июля был неверный знак — расходы
      прибавлялись к прибыли. Рентабельность EBITDA показывалась как 51%, фактическая — ${Pct(k.ebitda_margin_fact)}.
      Бизнес не менялся, изменилась корректность модели.</div>

    ${buildEvent(d)}

    <div class="sec">Расходы · с 01.06.2026</div>
    <div class="opt-grid">
      <div class="opt ${grew?'warn':''}">
        <div class="opt-t">Фиксированный OPEX команды</div>
        <div class="opt-flow">
          <span class="opt-from">${Nf(k.opex_before)} ₽</span>
          <span class="opt-arrow">→</span>
          <span class="opt-to" ${grew?'style="color:var(--gold-txt)"':''}>${Nf(k.opex_after)} ₽</span>
        </div>
        <div class="opt-save ${grew?'neg':''}">${grew?'Рост':'Экономия'} ${grew?'+':'−'}${Nf(Math.abs(opexDelta))} ₽/мес · ≈ ${Nc(opexYear)} ₽/год</div>
        <div class="opt-note">Уход Гудковой снял 425 532 ₽, но добавились Дубровин и Кэт как CEO/CPO,
          вышла Айнабекова и вырос счёт Борониной. Чистая разница невелика.</div>
      </div>
      <div class="opt warn">
        <div class="opt-t">OPEX на одного клиента</div>
        <div class="opt-flow"><span class="opt-big">${Nf(perClient)} ₽</span>
          <span style="font-size:11px;color:var(--muted)">в месяц</span></div>
        <div class="opt-save neg">${Nf(k.opex_after)} ₽ ÷ ${k.clients_active} клиентов</div>
        <div class="opt-note">Тариф 5 млн с трекером Дубровина при этой нагрузке не окупается.
          Единственный рычаг — количество клиентов: на 15 клиентах накладные падают до ${Nf(k.opex_after/15)} ₽.</div>
      </div>
    </div>

    <div class="sec">Выручка и EBITDA по месяцам</div>
    <div class="charts-grid">
      <div class="card"><div class="card-t">Помесячная динамика · факт по июль включительно</div>
        <div class="legend">
          <div><span class="sw plan"></span>Выручка, план</div>
          <div><span class="sw fact"></span>Выручка, факт</div>
          <div><span class="sw eb"></span>EBITDA, факт</div>
        </div>
        <div class="chart-box"><canvas id="cm"></canvas></div></div>
    </div>

    <div class="sec">Портфель и график платежей</div>
    <div class="bot-grid">
      <div class="card">
        <div class="card-t">Портфель компаний · ${k.clients_active} активных</div>
        ${d.c.map(c=>{
          const paused=/Пауза|⏸/.test(String(c[1]||''));
          return `<div class="cr ${paused?'paused':''}">
            <div class="cr-l"><div class="cr-name">${esc(c[0])}</div><div class="cr-trk">${esc(c[2]||'')}</div></div>
            <div class="cr-r"><div class="ct ${statusClass(c[1])}">${esc(c[1])}</div>
            <div class="cr-next">след. платёж: ${esc(c[3]||'—')}</div></div></div>`;}).join('')}
      </div>
      <div class="card">
        <div class="card-t">График платежей · акселерация 2026 (кассовый)</div>
        ${d.p.map((row,idx)=>{
          const name=row[0], months=row.slice(1,13), total=row[13], off=row[14]===0;
          return `<div class="acc-item ${off?'off':''}">
            <button class="acc-head" aria-expanded="false" data-i="${idx}">
              <span class="acc-name"><span class="acc-chev">▶</span>${esc(name)}
                ${off?'<span class="off-tag">не в плане</span>':''}</span>
              <span class="acc-tot">${Nc(total)} ₽</span>
            </button>
            <div class="acc-body" id="ab${idx}"><div class="months">
              ${months.map((m,i)=>`<div class="mcell ${m>0?'paid':''}">
                <div class="mcell-m">${MONTHS[i]}</div>
                <div class="mcell-v">${m>0?Nc(m):'·'}</div></div>`).join('')}
            </div></div></div>`;}).join('')}
        <div class="pt-row"><span>План поступлений акселерации / год</span><span>${Nc(d.pt?d.pt[13]:null)} ₽</span></div>
        <div class="pt-row" style="border:0;padding-top:2px"><span>Поступило на отчётную дату</span><span>${Nc(k.aks_fact)} ₽</span></div>
      </div>
    </div>

    <div style="height:28px"></div>
    ${buildRec(d)}

    <div class="ftr">
      <span style="font-family:'DM Mono',monospace">Фонд-Акселератор МД · ООО «Группа Развития»</span>
      <span>${esc(k.updated_label||'')} · <a href="https://fond-accelerator.ru" target="_blank" rel="noopener">fond-accelerator.ru</a></span>
    </div>`;

  document.querySelectorAll('.acc-head').forEach(b=>b.addEventListener('click',()=>{
    const open=b.getAttribute('aria-expanded')==='true';
    b.setAttribute('aria-expanded',String(!open));
    document.getElementById('ab'+b.dataset.i).classList.toggle('open',!open);
  }));

  window.__d=d;
  applyTheme(document.documentElement.getAttribute('data-theme')||'dark');
  requestAnimationFrame(()=>buildChart(d));
}

async function init(){
  document.getElementById('loader').style.display='flex';
  document.getElementById('app').style.display='none';
  const {d,demo,err}=await loadData();
  const time=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('loader').style.display='none';
  document.getElementById('app').style.display='block';
  render(d,demo,err,time);
}
init();
</script>
</body>
</html>
