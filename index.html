<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фонд-акселератор — управленческий дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
/* ── Бренд-система Integrity ─────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --petrol:#1C4A43; --petrol-d:#12332E; --copper:#B9794B;
  --ink:#262624; --brown:#5E4A38; --muted:#6E6A61;
  --ivory:#F5F2EC; --paper:#FBFAF7; --sand:#F0E6DB; --line:#D8D4C9;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--petrol)}
button{font-family:var(--sans)}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px 48px}

/* кикеры и подписи — всегда моно, капсом, с трекингом */
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brown)}
.kick.cu{color:var(--copper)}
.kick.iv{color:var(--ivory);opacity:.8}
.mono{font-family:var(--mono)}

/* логотип: точка А → линия → точка Б */
.logo{display:inline-flex;align-items:center;gap:0;height:12px}
.logo .a{width:12px;height:12px;border-radius:50%;background:var(--copper)}
.logo .l{width:38px;height:1.5px;background:var(--copper)}
.logo .b{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--copper)}
.logo.sm .a,.logo.sm .b{width:8px;height:8px}
.logo.sm .l{width:22px}

/* шапка — единственный тёмный якорь */
.hdr{background:var(--petrol-d);color:var(--ivory);margin:0 -28px;padding:26px 28px 24px}
.hdr-in{max-width:1240px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hdr h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:14px}
.hdr .sub{font-size:12.5px;color:var(--ivory);opacity:.75;margin-top:4px}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border:1px solid rgba(245,242,236,.35);color:var(--ivory)}
.tag.cu{border-color:var(--copper);color:var(--copper)}
.btn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border:1px solid var(--copper);background:transparent;color:var(--ivory);cursor:pointer}
.btn:hover{background:var(--copper);color:var(--petrol-d)}
.btn:focus-visible,a:focus-visible,.acc-head:focus-visible{outline:2px solid var(--copper);outline-offset:2px}

/* секции */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:40px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec .kick{text-align:right}
@media(max-width:680px){.sec{flex-direction:column;align-items:flex-start;gap:4px}.sec .kick{text-align:left}}

/* карточки */
.card{background:var(--paper);border:.75px solid var(--line);padding:18px 20px}
.card h3{font-size:13.5px;font-weight:700;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1000px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.g6,.g4,.g3,.g2{grid-template-columns:1fr}.wrap{padding:0 16px 40px}.hdr{margin:0 -16px;padding:20px 16px}}

/* статусная полоса */
.strip{display:flex;flex-wrap:wrap;gap:0;border:.75px solid var(--line);background:var(--paper);margin-top:22px}
.strip>div{flex:1 1 200px;padding:14px 18px;border-right:.75px solid var(--line)}
.strip>div:last-child{border-right:0}
.strip b{display:block;font-family:var(--mono);font-size:15px;font-weight:500;margin-top:6px;color:var(--ink)}

/* герой-числа без боксов, с тонкими вертикальными разделителями */
.hero{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--paper);border:.75px solid var(--line)}
.hero>div{padding:26px 26px 22px;border-right:.75px solid var(--line)}
.hero>div:last-child{border-right:0}
.hero .v{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1;margin:12px 0 10px;color:var(--petrol)}
.hero .v.cu{color:var(--copper)}
.hero .n{font-size:12.5px;color:var(--brown)}
@media(max-width:820px){.hero{grid-template-columns:1fr}.hero>div{border-right:0;border-bottom:.75px solid var(--line)}.hero>div:last-child{border-bottom:0}.hero .v{font-size:30px}}

/* строки-ведомости */
.ledger{width:100%;border-collapse:collapse}
.ledger td{padding:9px 0;border-bottom:.75px solid var(--line);vertical-align:top}
.ledger tr:last-child td{border-bottom:0}
.ledger td.a{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap;padding-left:16px;color:var(--ink)}
.ledger td.a.neg{color:var(--copper)}
.ledger tr.tot td{font-weight:700;border-top:1.5px solid var(--petrol);border-bottom:0;padding-top:12px}
.ledger tr.tot td.a{font-size:14px;color:var(--petrol)}
.ledger .sub{display:block;font-size:11.5px;color:var(--brown);margin-top:2px}

/* маркер статуса — форма, не цвет */
.mk{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--petrol);vertical-align:middle;margin-right:8px;flex:none}
.mk.full{background:var(--petrol)}
.mk.half{background:linear-gradient(90deg,var(--petrol) 50%,transparent 50%)}
.mk.cu{border-color:var(--copper)}
.mk.cu.full{background:var(--copper)}

/* полосы выполнения */
.bar{height:6px;background:var(--sand);position:relative;margin-top:10px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--petrol)}
.bar i.cu{background:var(--copper)}
.bar.thin{height:3px}

/* KPI */
.kpi{background:var(--paper);border:.75px solid var(--line);padding:16px 18px}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:500;letter-spacing:-.01em;margin:8px 0 12px;color:var(--petrol)}
.kpi .r{display:flex;justify-content:space-between;font-size:12px;color:var(--brown);padding:5px 0;border-top:.75px solid var(--line)}
.kpi .r b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--ink)}
.kpi .r b.cu{color:var(--copper)}
.kpi .note{font-size:11.5px;color:var(--brown);margin-top:8px;line-height:1.4}

/* потоки события */
.stream{padding:14px 0;border-bottom:.75px solid var(--line)}
.stream:last-child{border-bottom:0}
.stream .t{display:flex;justify-content:space-between;align-items:baseline}
.stream .t b{font-family:var(--mono);font-weight:500;font-size:14px}
.stream .m{font-size:12px;color:var(--brown);margin-top:3px}

/* портфель и график платежей */
.cr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:.75px solid var(--line)}
.cr:last-child{border-bottom:0}
.cr .nm{font-weight:500;font-size:13px}
.cr .tr{font-size:11.5px;color:var(--brown);margin-top:2px}
.cr .st{display:flex;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--brown);white-space:nowrap}
.cr .nx{font-size:11.5px;color:var(--brown);text-align:right;margin-top:3px}
.acc{border-bottom:.75px solid var(--line)}
.acc:last-of-type{border-bottom:0}
.acc-head{display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer;background:none;border:0;width:100%;text-align:left;color:var(--ink)}
.acc-head .nm{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.acc-head .chev{width:0;height:0;border-left:5px solid var(--copper);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.acc.open .chev{transform:rotate(90deg)}
.acc-head .tot{font-family:var(--mono);font-size:12.5px;font-weight:500;white-space:nowrap;padding-left:12px}
.acc-body{display:none;padding:2px 0 12px}
.acc.open .acc-body{display:block}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.mc{padding:6px 2px;text-align:center;border:.75px solid var(--line);background:var(--paper)}
.mc.paid{background:var(--sand);border-color:var(--copper)}
.mc .m{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--brown)}
.mc .v{font-family:var(--mono);font-size:10.5px;margin-top:3px;color:var(--ink)}
@media(max-width:680px){.months{grid-template-columns:repeat(6,1fr)}}

/* таблица платежей */
.tbl{width:100%;min-width:760px;border-collapse:collapse;font-size:12.5px}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brown);text-align:left;padding:8px 8px 8px 0;border-bottom:1.5px solid var(--petrol);font-weight:500}
.tbl td{padding:7px 8px 7px 0;border-bottom:.75px solid var(--line);vertical-align:top}
.tbl td.a,.tbl th.a{text-align:right;font-family:var(--mono);white-space:nowrap}
.tbl td.d{font-family:var(--mono);font-size:11.5px;white-space:nowrap;color:var(--brown)}
.tbl td.neg{color:var(--copper)}
.tbl-wrap{overflow-x:auto}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border:.75px solid var(--line);background:var(--paper);color:var(--brown);cursor:pointer}
.chip.on{border-color:var(--petrol);color:var(--petrol);background:var(--sand)}

/* признание */
.flow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.flow .v{font-family:var(--mono);font-size:19px;font-weight:500;margin-top:6px;color:var(--petrol)}
.recr{display:grid;grid-template-columns:1.4fr 2fr 1fr;gap:14px;align-items:center;padding:8px 0;border-bottom:.75px solid var(--line);font-size:12.5px}
.recr:last-child{border-bottom:0}
.recr .p{font-family:var(--mono);font-size:11.5px;text-align:right;white-space:nowrap}
@media(max-width:680px){.flow{grid-template-columns:1fr}.recr{grid-template-columns:1fr;gap:6px}}

.chart-box{height:300px;position:relative}
.info{background:var(--sand);border:.75px solid var(--copper);padding:12px 16px;font-size:12.5px;margin-top:18px}
.info code{font-family:var(--mono);font-size:11px}
.ftr{margin-top:48px;padding-top:14px;border-top:.75px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11.5px;color:var(--brown)}
.small{font-size:11.5px;color:var(--brown);line-height:1.45}
#loader{display:flex;align-items:center;gap:14px;padding:40px 0;color:var(--brown)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loader"><span class="logo"><span class="a"></span><span class="l"></span><span class="b"></span></span><span class="kick">Загружаю фид WEB</span></div>
  <div id="app" style="display:none"></div>
</div>

<script>
/* ═══════════ КОНФИГ ═══════════
   Опубликованная CSV-ссылка вкладки WEB (файл v15, срез 09.09.2026). */
const PUB_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQm44TrbgO6MvBJYKetceRUs0agWwmQOdp3QV0Dy4cOfDuX5vhDCKF3spgpVnh2gQ2E5kBOMDjeye08/pub?gid=1191732908&single=true&output=csv';
/* ══════════════════════════════ */

const MONTHS = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

/* Демо-снимок v15 (09.09.2026) — показывается, только если фид недоступен */
const DEMO = {
  k:{
    updated_label:'Факт по банку на 08.09.2026 · план 2026 (демо-снимок)', month_label:'сентябрь 2026',
    gross_plan:79565000, gross_fact:39789472, net_plan:65217213, net_fact:32614322,
    aks_plan:42497000, aks_fact:23247000, mm_plan:37068000, mm_fact:16542472,
    ebitda_plan:27598312, ebitda_fact:12127516, ebitda_margin_plan:0.423, ebitda_margin_fact:0.372,
    np_plan:20698734, np_fact:9095637, np_margin_plan:0.317,
    clients_active:9, clients_target:14,
    cash_open:4030220, cash_eoy:41166252, inflow_period:71615995, outflow_period:-34479963,
    vat_payable_year:13106188, fc_gross:84151472, fc_net:68976617, fc_ebitda:31301915, fc_np:23476436, fc_cash:41166252, fc_clients:14, fc_deferred:23070078,
    rec_deferred_acc:6529078, rec_deferred_mm:16541000, rec_deferred_total:23070078,
    rec_asof:'оценка на 10.08.2026 (снимок Натальи 30.06 + платежи и линейное признание)',
    mm_aug_title:'Августовский ММ · 25–30.08.2026 · Hilton Garden Inn New Riga',
    mm_aug_razbor_rub:6800000, mm_aug_guest_rub:8410000, mm_aug_org_rub:1331000,
    mm_aug_gross:16541000, mm_aug_vat:-2982803, mm_aug_net:13558197, mm_aug_personal_razbor_gross:2250000,
    mm_aug_cost_bank:3272050, mm_aug_cost_cash:633516, mm_aug_reimburse:-1378900, mm_aug_team_comp:148249,
    mm_aug_bonus:195500, mm_aug_olga:148936, mm_aug_cost_total:3019351,
    mm_aug_contribution:10538846, mm_aug_margin:0.777, mm_aug_contribution_ex_aks_bonus:10608846,
    mm_aug_contribution_ex_personal:8694583, mm_aug_may_loss:121354, mm_aug_tax_ind:-2634711, mm_aug_np_ind:7904134,
    mm_aug_uncollected:151200, mm_aug_cash_rest:745384, mm_aug_cash_handed:677000, mm_aug_cash_gap:-18016, mm_aug_debt:350000,
    mm_aug_people_razbor:7, mm_aug_people_guest:39, mm_aug_people_org:12, mm_aug_people:58,
    mm_rev_plan:16776000, mm_people_plan:36,
    dec_title:'Декабрьский ММ · дата и площадка не определены',
    dec_guests_plan:40, dec_guest_price:350000, dec_guests_rub:14000000, dec_razbor_plan:8, dec_razbor_rub:10000000,
    dec_org_plan:8, dec_org_rub:976000, dec_gross_plan:24976000, dec_net_plan:20472131, dec_cost_plan:3733168,
    dec_contribution_plan:16738964, dec_margin_plan:0.818, dec_collected:0, dec_people_fact:0, dec_days_left:'дата не задана',
    cash_bank_0906_calc:19859206,
  },
  c:[], p:[], pt:null, ev:[], rec:[], eb:{}, rv:{}, mp:[],
};

/* ── утилиты ── */
const Nc = n => {
  if(n==null||n===''||(typeof n==='number'&&isNaN(n))) return '—';
  const a=Math.abs(n), s=n<0?'−':'';
  if(a>=1e9) return s+(a/1e9).toFixed(2).replace('.',',')+' млрд';
  if(a>=1e6) return s+(a/1e6).toFixed(2).replace('.',',')+' млн';
  if(a>=1e3) return s+(a/1e3).toFixed(0)+' тыс';
  return s+Math.round(a);
};
const Nf = n => (n==null||isNaN(n))?'—':new Intl.NumberFormat('ru-RU').format(Math.round(n)).replace(/-/,'−');
const Pct = n => (n==null||isNaN(n))?'—':(n*100).toFixed(1).replace('.',',')+'%';
const Pct0 = n => (n==null||isNaN(n))?'—':Math.round(n*100)+'%';
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* убираем символы-иконки из статусов (бренд: без эмодзи в интерфейсах) */
const clean = s => String(s||'').replace(/[✓⟳⚠☆⏸▶◀●○◐]/g,'').replace(/^\s*[—-]\s*/,'').trim();

/* ── парсер CSV вкладки WEB ── */
function splitCSV(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ if(q && line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===',' && !q){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur); return out;
}
/* число из формата Sheets: «16 541 000», «(15)», «77,7%», «-», «—», пусто */
function num(v){
  if(v==null) return null;
  let s=String(v).trim().replace(/"/g,'').replace(/[\s\u00a0\u202f]/g,'');
  if(s===''||s==='-'||s==='—'||s==='·') return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  if(s.startsWith('−')){ neg=true; s=s.slice(1); }
  let pct=false;
  if(s.endsWith('%')){ pct=true; s=s.slice(0,-1); }
  const n=parseFloat(s.replace(',','.'));
  if(isNaN(n)) return null;
  return (neg?-n:n)/(pct?100:1);
}
const TEXT_KEY=/_(label|title|dates|iso|target|asof|venue|note|version)$/;

function parseFeed(txt){
  const k={}, c=[], p=[], ev=[], rec=[], eb={}, rv={}, mp=[]; let pt=null;
  txt.trim().split(/\r?\n/).forEach(line=>{
    const f=splitCSV(line); const tag=(f[0]||'').trim();
    if(tag==='K'){
      const key=(f[1]||'').trim(); const raw=(f[2]||'').trim().replace(/"/g,'');
      if(TEXT_KEY.test(key)){ k[key]=raw; }
      else { const nv=num(raw); k[key]=(nv==null ? (raw && /[а-яa-z]/i.test(raw) ? raw : 0) : nv); }
    }
    else if(tag==='C'){ c.push([f[1],f[2],f[3],f[4],f[5]].map(x=>(x||'').trim().replace(/"/g,''))); }
    else if(tag==='P'){ p.push([(f[1]||'').trim().replace(/"/g,''),...f.slice(2,15).map(num)]); }
    else if(tag==='PT'){ pt=[(f[1]||'').trim(),...f.slice(2,15).map(num)]; }
    else if(tag==='EV'){ ev.push({name:(f[1]||'').trim(),n:num(f[2])||0,rev:num(f[3])||0,price:(f[4]||'').trim(),role:(f[5]||'').trim()}); }
    else if(tag==='R'||tag==='RC'){ rec.push({name:(f[1]||'').trim(),cf:num(f[2])||0,pl:num(f[3])||0,def:num(f[4]),pct:num(f[5])}); }
    else if(tag==='EB'){ eb[(f[1]||'').trim()]={plan:num(f[2]),fact:num(f[3])}; }
    else if(tag==='RV'){ rv[(f[1]||'').trim()]={plan:num(f[2]),fact:num(f[3])}; }
    else if(tag==='MP'){
      const name=(f[2]||'').trim(); if(!name) return;
      mp.push({date:(f[1]||'').trim(), name, event:(f[3]||'').trim(), type:(f[4]||'').trim(), owner:(f[5]||'').trim(),
        invoice:num(f[6]), paid:num(f[7]), people:num(f[8]), status:(f[9]||'').trim(), note:clean(f[10]).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F]/gu,'').trim()});
    }
  });
  return {k,c,p,pt,ev,rec,eb,rv,mp};
}

async function loadData(){
  if(!PUB_CSV_URL) return {d:DEMO, demo:true, err:null};
  try{
    const r=await fetch(PUB_CSV_URL+(PUB_CSV_URL.includes('?')?'&':'?')+'cb='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const txt=await r.text();
    if(txt.includes('<!DOCTYPE')||txt.includes('<html')) throw new Error('лист не опубликован');
    const d=parseFeed(txt);
    if(d.k.gross_plan==null) throw new Error('данные не распознаны');
    return {d, demo:false, err:null};
  }catch(e){ return {d:DEMO, demo:true, err:e.message}; }
}

/* ── компоненты ── */
const mark = kind => `<span class="mk ${kind}"></span>`;
function statusMark(s){
  const t=clean(s);
  if(/DD|дью|проверк/i.test(t)) return 'half';
  if(/ожида|счёт|пауза|не назнач/i.test(t)) return '';
  return 'full';
}
function bar(pct, cu){
  const w=pct==null?0:Math.max(0,Math.min(100,pct*100));
  return `<div class="bar"><i class="${cu?'cu':''}" style="width:${w}%"></i></div>`;
}
function kpi(label, plan, fact, note){
  const pct=(plan!=null&&plan!==0)?fact/plan:null;
  return `<div class="kpi">
    <div class="kick">${esc(label)}</div>
    <div class="v">${Nc(plan)} ₽</div>
    <div class="r"><span>план год</span><b>${Nf(plan)}</b></div>
    <div class="r"><span>факт YTD</span><b>${Nf(fact)}</b></div>
    <div class="r"><span>выполнение</span><b class="cu">${Pct(pct)}</b></div>
    ${bar(pct)}
    ${note?`<div class="note">${note}</div>`:''}

}
function ledgerRow(label, val, sub, opts={}){
  const cls = (val!=null && val<0)?'a neg':'a';
  return `<tr class="${opts.tot?'tot':''}"><td>${esc(label)}${sub?`<span class="sub">${esc(sub)}</span>`:''}</td><td class="${cls}">${opts.pct!=null?Pct(opts.pct):Nf(val)+(opts.tot||opts.rub!==false?' ₽':'')}</td></tr>`;

/* ── реестр платежей события ── */
let mpFilter='all';
function buildPayments(d){
  const rows=(d.mp||[]);
  if(!rows.length) return '';
  const paid=rows.filter(r=>r.paid!=null&&r.paid!==0);
  const total=paid.reduce((s,r)=>s+r.paid,0);
  return `<div class="acc" id="mpacc" style="margin-top:14px;border:.75px solid var(--line);background:var(--paper);padding:0 20px">
    <button class="acc-head" type="button" onclick="document.getElementById('mpacc').classList.toggle('open')">
      <span class="nm"><span class="chev"></span>Реестр платежей события · ${paid.length} платежей и возвратов</span>
      <span class="tot">${Nf(total)} ₽</span></button>
    <div class="acc-body">
      <div class="filters" id="mpf">
        ${['all','Разбор','Гость','Орг. взнос','Возврат'].map(f=>`<span class="chip ${mpFilter===f?'on':''}" data-f="${f}" onclick="setMpFilter('${f}')">${f==='all'?'все':f}</span>`).join('')}
      </div>
      <div class="tbl-wrap" id="mptbl">${mpTable(rows)}</div>
    </div></div>`;
}
function mpTable(rows){
  const list=rows.filter(r=>{
    if(mpFilter==='all') return true;
    if(mpFilter==='Возврат') return /возврат/i.test(r.status) || (r.paid!=null && r.paid<0);
    return r.type===mpFilter && !(r.paid!=null && r.paid<0);
  });
  const body=list.map(r=>{
    const neg=r.paid!=null&&r.paid<0;
    const mk = neg?'':( (r.invoice!=null && r.paid!=null && r.paid>0 && r.paid<r.invoice) ? 'half' : (r.paid?'full':'') );
    return `<tr><td class="d">${esc(r.date||'—')}</td><td>${esc(r.name)}<span class="sub small" style="display:block">${esc(r.note.slice(0,90))}${r.note.length>90?'…':''}</span></td>
      <td>${esc(r.type)}</td><td>${esc(r.owner)}</td>
      <td class="a">${r.invoice!=null?Nf(r.invoice):'—'}</td>
      <td class="a ${neg?'neg':''}">${r.paid!=null?Nf(r.paid):'—'}</td>
      <td style="white-space:nowrap">${mark(mk)}<span class="kick" style="font-size:9px">${esc(r.status)}</span></td></tr>`;
  }).join('');
  return `<table class="tbl"><thead><tr><th>дата</th><th>участник</th><th>тип</th><th>отв.</th><th class="a">счёт</th><th class="a">оплачено</th><th>статус</th></tr></thead><tbody>${body}</tbody></table>`;
}
let LAST=null;
function setMpFilter(f){ mpFilter=f; if(!LAST) return;
  document.getElementById('mptbl').innerHTML=mpTable(LAST.mp||[]);
  document.querySelectorAll('#mpf .chip').forEach(c=>c.classList.toggle('on',c.dataset.f===f)); }

/* ── Признание ── */
function buildRec(d){
  const k=d.k, clients=d.rec||[];
  if(!clients.length) return '';
  const cf=clients.reduce((s,x)=>s+x.cf,0), pl=clients.reduce((s,x)=>s+x.pl,0);
  const rows=clients.map(c=>{
    const def=(c.def!=null&&!isNaN(c.def))?c.def:(c.cf-c.pl);
    const pct=(c.pct!=null&&!isNaN(c.pct))?c.pct:(c.cf?c.pl/c.cf:0);
    const debt=def<0;
    return `<div class="recr"><div>${esc(c.name)}</div>
      <div>${bar(pct, debt)}</div>
      <div class="p">${debt?'долг ':'отложено '}${Nf(Math.abs(def))} ₽ · ${Pct0(pct)}</div></div>`;
  }).join('');
  return `
  <div class="sec"><h2>Признание выручки по акселерации</h2><span class="kick">метод начисления · ${esc((k.rec_asof||'').split('·')[0].trim())}</span></div>
  <div class="card">
    <div class="flow">
      <div><div class="kick">Поступило</div><div class="v">${Nf(cf)} ₽</div></div>
      <div><div class="kick">Отработано</div><div class="v">${Nf(pl)} ₽</div></div>
      <div><div class="kick cu">Отложено по акселерации</div><div class="v" style="color:var(--copper)">${Nf(k.rec_deferred_acc!=null?k.rec_deferred_acc:cf-pl)} ₽</div></div>
    </div>
    ${rows}
    <p class="small" style="margin-top:12px">Оценка: снимок бухгалтерии на 30.06 плюс платежи и линейное признание. Авансы августовского ММ здесь не показаны — событие проведено 25–30.08, выручка по нему признана; лист «Признание» в модели ещё держит их отложенными и требует обновления.</p>
  </div>`;
}

/* ── график EBITDA ── */
let chartM=null;
function buildChart(k, eb){
  if(chartM){chartM.destroy();chartM=null;}
  const cm=document.getElementById('cm'); if(!cm||typeof Chart==='undefined') return;
  const plan=[], fact=[];
  for(let i=1;i<=12;i++){ const e=eb['m'+i]; plan.push(e?(e.plan??0):0); fact.push(e?e.fact:null); }
  let lastF=-1; fact.forEach((v,i)=>{ if(v!=null) lastF=i; });
  const factCut=fact.map((v,i)=> i<=lastF ? v : null);
  const tick={color:'#5E4A38',font:{size:10,family:"'JetBrains Mono',monospace"}};
  chartM=new Chart(cm,{type:'bar',
    data:{labels:MONTHS,datasets:[
      {label:'План',data:plan,backgroundColor:'#F0E6DB',borderColor:'#D8D4C9',borderWidth:1,borderRadius:0},
      {label:'Факт',data:factCut,backgroundColor:'#1C4A43',borderRadius:0}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,labels:{color:'#5E4A38',font:{size:10,family:"'JetBrains Mono',monospace"},boxWidth:10}},
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+Nf(c.raw)+' ₽'}}},
      scales:{x:{grid:{color:'#EDE8DF'},ticks:tick},y:{grid:{color:'#EDE8DF'},ticks:{...tick,callback:v=>Nc(v)}}}}});
}

      <span><span class="logo sm"><span class="a"></span><span class="l"></span><span class="b"></span></span>&nbsp;&nbsp;Фонд-акселератор · ООО «Группа Развития»</span>
      <span>${esc(k.feed_version||k.updated_label||'')} · <a href="https://fond-accelerator.ru" target="_blank" rel="noopener">fond-accelerator.ru</a></span>
    </div>`;
  requestAnimationFrame(()=>buildChart(k, d.eb||{}));
}

async function init(){
  document.getElementById('loader').style.display='flex';
  document.getElementById('app').style.display='none';
  const {d,demo,err}=await loadData();
  const time=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('loader').style.display='none';
  document.getElementById('app').style.display='block';
  render(d,demo,err,time);
}
init();
</script>
