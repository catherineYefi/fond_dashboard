*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{

.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
a{color:var(--petrol)}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px;border-radius:4px}

/* ── topbar ── */
.topbar{position:sticky;top:0;z-index:60;background:rgba(250,250,247,.88);
  backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;

.brand{display:flex;align-items:baseline;gap:14px}
.brand .nm{font-weight:800;letter-spacing:-.03em;font-size:19px;line-height:1}
.brand .rule{width:1px;height:16px;background:var(--line2)}
.brand .sub{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mut2)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;
  border:1px solid var(--line2);border-radius:999px;padding:6px 13px;color:var(--mut);background:var(--card)}
.chip.live{color:var(--petrol);border-color:var(--petrol)}
.chip.demo{color:var(--warm);border-color:var(--warm)}
.chip.err{color:var(--alert);border-color:var(--alert)}
button.chip{cursor:pointer;transition:background .18s,color .18s}
button.chip:hover{background:var(--petrol);color:#fff;border-color:var(--petrol)}

/* ── section furniture ── */
section{padding:52px 0;border-top:1px solid var(--line)}
section:first-of-type{border-top:0}
.eyebrow{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:11px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--petrol);
  display:flex;align-items:center;gap:12px;margin-bottom:18px}
.eyebrow::before{content:"";width:24px;height:1px;background:var(--warm);flex:none}
.eyebrow .far{margin-left:auto;color:var(--mut2);letter-spacing:.08em;text-transform:none;font-size:11px}
h2.title{font-size:clamp(22px,3.2vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:8px}
.lead{color:var(--mut);font-size:15px;max-width:64ch}
.note{color:var(--mut2);font-size:13px;line-height:1.55}

/* ── SIGNATURE: ledger rule ── */
.lr{position:relative;height:3px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:10px}
.lr i{position:absolute;inset:0 auto 0 0;background:var(--petrol);border-radius:2px;
  transform-origin:left;transform:scaleX(0);animation:grow .9s cubic-bezier(.2,.7,.2,1) forwards}
.lr i.warm{background:var(--warm)} .lr i.alert{background:var(--alert)} .lr i.sage{background:var(--sage)}
@keyframes grow{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){ .lr i{animation:none;transform:scaleX(1)} }

/* ── hero: event ledger ── */

.hero-money .big{font-family:'JetBrains Mono',monospace;font-weight:600;

.hero-money .pctline b{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;color:var(--petrol)}

  text-transform:uppercase;color:var(--mut2);border:1px solid var(--line2);border-radius:999px;padding:2px 8px}

/* ── info blocks ── */
.cols{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);

.col .v.warm{color:var(--warm)} .col .v.petrol{color:var(--petrol)} .col .v.alert{color:var(--alert)}
.col .s{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.5}

.callout{border-left:2px solid var(--warm);padding:2px 0 2px 16px;margin-top:22px;
  font-size:13.5px;color:var(--mut);line-height:1.55}
.callout b{color:var(--ink);font-weight:600}

footer{border-top:1px solid var(--line);padding:26px 0 48px;color:var(--mut2);font-size:12.5px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

#loader{min-height:60vh;display:flex;align-items:center;justify-content:center;

  text-transform:uppercase;color:var(--mut2)}
</style>

/* ══════════════════════════════════════════════════════════

const PUB_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQm44TrbgO6MvBJYKetceRUs0agWwmQOdp3QV0Dy4cOfDuX5vhDCKF3spgpVnh2gQ2E5kBOMDjeye08/pub?gid=247575935&single=true&output=csv';

/* ── Демо: реальные значения v12 на 10.07.2026 ── */
const DEMO = {

    ['Разумный инвестор (Голубенко)',0,1250000,0,0,420000,420000,410000,1250000,0,0,0,0,3750000,1],

  rv:[[1250000,1250000],[2500000,2500000],[2500000,2500000],[2499118,2499118],[2954355,2954355],
      [3070000,3070000],[7010000,5510000],[14644000,0],[8500000,0],[1500000,0],[2500000,0],[31276000,0]],

/* ── утилиты ── */
const NBSP = /[\s\u00A0\u202F\u2009]/g;
function num(v){
  if(v==null) return null;
  if(typeof v==='number') return v;
  let s=String(v).trim().replace(/^"|"$/g,'').replace(/₽/g,'');
  if(!s || s==='—' || s==='-') return null;
  const pct = s.endsWith('%');
  if(pct) s=s.slice(0,-1);
  s=s.replace(NBSP,'');
  if(s.includes(',') && s.includes('.')) s=s.replace(/,/g,'');       // 1,250,000.50
  else if((s.match(/,/g)||[]).length===1 && /,\d{1,2}$/.test(s)) s=s.replace(',','.'); // 0,45
  else s=s.replace(/,/g,'');
  const n=parseFloat(s);
  if(isNaN(n)) return null;
  return pct ? n/100 : n;
}
const Nf = n => (n==null||isNaN(n)) ? '—' : new Intl.NumberFormat('ru-RU').format(Math.round(n));
const Nc = n => {
  const x = num(n); if(x==null) return '—';
  const a=Math.abs(x), s=x<0?'−':'';
  if(a>=1e6) return s+(a/1e6).toFixed(a>=1e7?1:2).replace('.',',')+' млн';
  if(a>=1e3) return s+Math.round(a/1e3)+' тыс';
  return s+Math.round(a);
};
const Pct = n => (n==null||isNaN(n)) ? '—' : (n*100).toFixed(n*100>=10?0:1).replace('.',',')+'%';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function splitCSV(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ if(q && line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===',' && !q){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur); return out;
}

const TEXT_KEYS = new Set(['updated_label','month_label','mm_title','mm_dates','mm_venue','rec_asof']);

function parseFeed(txt){
  const k={}, c=[], p=[], ev=[], rv=[], eb=[]; let pt=null;
  txt.trim().split(/\r?\n/).forEach(line=>{
    const f=splitCSV(line).map(x=>x.trim().replace(/^"|"$/g,''));
    const tag=(f[0]||'').trim();
    if(tag==='K'){
      const key=f[1]; if(!key) return;
      k[key] = TEXT_KEYS.has(key) ? f[2] : (num(f[2]) ?? 0);
    }
    else if(tag==='C'){ if(f[1]) c.push([f[1],f[2],f[3],f[4]]); }
    else if(tag==='P'){ if(f[1]) p.push([f[1], ...f.slice(2,14).map(num), num(f[14]), num(f[15])]); }
    else if(tag==='PT'){ pt=['ИТОГО', ...f.slice(2,14).map(num), num(f[14])]; }
    else if(tag==='RV'){ rv.push([num(f[2]), num(f[3])]); }
    else if(tag==='EB'){ eb.push([num(f[2]), num(f[3])]); }
    else if(tag==='EV'){ if(f[1]) ev.push([f[1], num(f[2]), num(f[3]), f[4], f[5]]); }
  });
  return {k,c,p,pt,rv,eb,ev};
}

async function loadData(){
  if(!PUB_CSV_URL) return {d:DEMO, demo:true, err:null};
  try{
    const r=await fetch(PUB_CSV_URL+(PUB_CSV_URL.includes('?')?'&':'?')+'cb='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=parseFeed(await r.text());
    if(!d.k.gross_plan) throw new Error('фид пустой или неверная вкладка');
    return {d, demo:false, err:null};
  }catch(e){ return {d:DEMO, demo:true, err:e.message}; }
}

/* ── блоки ── */
function lr(pct, cls){
  const w=Math.max(0,Math.min(100,(pct||0)*100));
  return `<div class="lr"><i class="${cls||''}" style="width:${w}%"></i></div>`;
}

function hero(k){
  const rows=[
    ['Разборы', k.mm_razbor_fact, k.mm_razbor_plan, k.mm_razbor_pct],
    ['Гости', k.mm_guest_fact, k.mm_guest_plan, k.mm_guest_pct],
    ['Орг. взносы действующих клиентов', k.mm_org_fact, k.mm_org_plan, k.mm_org_pct],
  ].map(([n,f,p,pc])=>`
    <div class="prow">
      <div class="nm">${esc(n)}</div>
      <div class="vv"><b>${f??'—'}</b> / ${p??'—'}</div>
      ${lr(pc, pc<0.4?'warm':'')}
    </div>`).join('');

  const days=k.mm_days_left;
  const urgent = days!=null && days<=60;
  return `
  <section>
    <div class="eyebrow">Мастермайнд · ${esc(k.mm_dates||'')}<span class="far">${esc(k.mm_venue||'')}</span></div>
    <div class="hero">
      <div class="hero-top">
        <div class="hero-money">
          <div class="big">${Nf(k.mm_rev_fact)} ₽</div>
          <div class="of">из ${Nf(k.mm_rev_plan)} ₽ плана события</div>
          ${lr(k.mm_rev_pct, k.mm_rev_pct<0.4?'warm':'')}
          <div class="pctline"><b>${Pct(k.mm_rev_pct)}</b><span>собрано к цели</span></div>
        </div>
        <div class="hero-people">${rows}</div>
      </div>
      <div class="hero-strip">
        <div class="hs"><div class="k">До события</div>
          <div class="v ${urgent?'warm':''}">${days??'—'}</div><div class="s">дней</div></div>
        <div class="hs"><div class="k">Людей подтверждено</div>
          <div class="v">${k.mm_people_fact??'—'} / ${k.mm_people_plan??'—'}</div>
          <div class="s">${Pct(k.mm_people_pct)} от плана</div></div>
        <div class="hs"><div class="k">Дебиторка</div>
          <div class="v warm">${Nf(k.mm_debt)} ₽</div><div class="s">счета не выставлены или не оплачены</div></div>
        <div class="hs"><div class="k">Прайс</div>
          <div class="v petrol">${Nc(k.price_razbor)}</div>
          <div class="s">разбор · гость ${Nc(k.price_guest)} · взнос ${Nc(k.price_org)}</div></div>
      </div>
    </div>
    <div class="callout">
      Чтобы закрыть план, за оставшиеся <b>${days??'—'} дней</b> нужно продать
      <b>${Math.max(0,(k.mm_razbor_plan||0)-(k.mm_razbor_fact||0))} разборов</b> и
      <b>${Math.max(0,(k.mm_guest_plan||0)-(k.mm_guest_fact||0))} гостей</b>.
    </div>
  </section>`;
}

function kpi(k){
  const cards=[
    ['Выручка GROSS', k.gross_fact, k.gross_plan, null],
    ['Выручка NET', k.net_fact, k.net_plan, null],
    ['EBITDA', k.ebitda_fact, k.ebitda_plan, `рент. ${Pct(k.ebitda_margin_fact)} · план ${Pct(k.ebitda_margin_plan)}`],
    ['Чистая прибыль', k.np_fact, k.np_plan, null],
  ].map(([n,f,p,extra])=>{
    const pc = (p!=null && p!==0) ? f/p : null;
    const neg = f!=null && f<0;
    return `<div class="kc">
      <div class="k">${esc(n)}</div>
      <div class="fact ${neg?'neg':''}">${Nf(f)} ₽</div>
      <div class="plan">план ${Nf(p)} ₽</div>
      ${lr(pc, neg?'alert':'')}
      <div class="foot"><span class="p">${Pct(pc)}</span><span class="m">${extra?esc(extra):'выполнение'}</span></div>
    </div>`;
  }).join('');

  return `
  <section>
    <div class="eyebrow">Финансовый результат<span class="far">${esc(k.updated_label||'')}</span></div>
    <div class="kgrid">${cards}</div>
    <div class="cols c3" style="margin-top:22px">
      <div class="col"><div class="k">Акселерация</div>
        <div class="v">${Nf(k.aks_fact)} ₽</div>
        <div class="s">план ${Nf(k.aks_plan)} ₽ · ${Pct(k.aks_plan?k.aks_fact/k.aks_plan:null)}</div></div>
      <div class="col"><div class="k">Мастермайнд</div>
        <div class="v">${Nf(k.mm_fact)} ₽</div>
        <div class="s">план ${Nf(k.mm_plan)} ₽ · ${Pct(k.mm_plan?k.mm_fact/k.mm_plan:null)}</div></div>
      <div class="col"><div class="k">Клиентов на акселерации</div>
        <div class="v">${k.clients_active??'—'} <span style="color:var(--mut2);font-size:16px">/ ${k.clients_target??'—'}</span></div>
        <div class="s">активных сейчас / цель на конец года</div></div>
    </div>
    <div class="callout">
      <b>Пересчитано 10.07.2026.</b> В фактических расходах июня и июля был неверный знак — расходы прибавлялись
      к прибыли. Рентабельность EBITDA показывалась как 51%, фактическая — ${Pct(k.ebitda_margin_fact)}.
      Бизнес не менялся, изменилась только корректность модели.
    </div>
  </section>`;
}

function chartSec(){
  return `
  <section>
    <div class="eyebrow">Выручка и EBITDA по месяцам<span class="far">факт — по июль включительно</span></div>
    <div class="chartbox">
      <div class="legend">
        <div><span class="sw plan"></span>Выручка, план</div>
        <div><span class="sw fact"></span>Выручка, факт</div>
        <div><span class="sw eb"></span>EBITDA, факт</div>
      </div>
      <div class="cwrap"><canvas id="cm"></canvas></div>
    </div>
  </section>`;
}

function stCls(s){
  s=String(s||'');
  if(s.includes('Актив')) return 'ok';
  if(s.includes('Ожидаем')||s.includes('Счёт')) return 'warn';
  if(s.includes('DD')) return 'dd';
  return 'pause';
}
function portfolio(d){
  const rows=d.c.map(([n,st,trk,next])=>{
    const paused=String(st||'').includes('Пауза');
    return `<div class="trow ${paused?'paused':''}">
      <div class="nm">${esc(n)}</div>
      <div><span class="st ${stCls(st)}">${esc(st)}</span></div>
      <div class="mono" style="font-size:13px;color:var(--mut)">${esc(trk)}</div>
      <div class="mono" style="font-size:13px">${esc(next)}</div>
    </div>`;}).join('');
  return `
  <section>
    <div class="eyebrow">Портфель акселерации<span class="far">${d.k.clients_active??'—'} активных</span></div>
    <div class="tbl">
      <div class="trow head"><div>Клиент</div><div>Статус</div><div>Трекер</div><div>След. платёж</div></div>
      ${rows}
    </div>
  </section>`;
}

function payments(d){
  const lines=d.p.map((r,i)=>{
    const name=r[0], months=r.slice(1,13), total=r[13], flag=r[14];
    const off = flag===0;
    const cells=months.map((v,j)=>`<div class="mc ${v?'paid':''}">
        <div class="mm">${MONTHS[j]}</div><div class="mv">${v?Nc(v):'·'}</div></div>`).join('');
    return `<div class="pline">
      <button class="phead" aria-expanded="false" data-i="${i}">
        <span>${esc(name)} ${off?'<span class="paused-tag">не в плане</span>':''}</span>
        <span class="r"><span class="sum" style="${off?'color:var(--mut2)':''}">${Nf(total)} ₽</span><span class="car"></span></span>
      </button>
      <div class="pbody" id="pb${i}"><div class="mgrid">${cells}</div></div>
    </div>`;}).join('');
  const pt=d.pt;
  return `
  <section>
    <div class="eyebrow">График платежей акселерации<span class="far">кассовый, 2026</span></div>
    <div class="pay">${lines}</div>
    <div class="cols c2" style="margin-top:22px">
      <div class="col"><div class="k">План поступлений за год</div>
        <div class="v petrol">${Nf(pt?pt[13]:null)} ₽</div>
        <div class="s">строки с флагом «не в плане» в сумму не входят</div></div>
      <div class="col"><div class="k">Поступило на 09.07</div>
        <div class="v">${Nf(d.k.aks_fact)} ₽</div>
        <div class="s">сверено с реестром финдиректора</div></div>
    </div>
  </section>`;
}

function deferred(k){
  return `
  <section>
    <div class="eyebrow">Отложенная выручка<span class="far">${esc(k.rec_asof||'')}</span></div>
    <div class="cols c3">
      <div class="col"><div class="k">Акселерация</div>
        <div class="v">${Nf(k.rec_deferred_acc)} ₽</div>
        <div class="s">деньги получены, услуга ещё не оказана</div></div>
      <div class="col"><div class="k">Авансы за августовский ММ</div>
        <div class="v">${Nf(k.rec_deferred_mm)} ₽</div>
        <div class="s">событие в августе — отработано 0%</div></div>
      <div class="col"><div class="k">Всего обязательств</div>
        <div class="v warm">${Nf(k.rec_deferred_total)} ₽</div>
        <div class="s">перед клиентами по методу начисления</div></div>
    </div>
    <div class="callout">
      Кассовый P&amp;L показывает деньги на счету, отложенная выручка — обязательства перед клиентами.
      Это две разные правды об одном бизнесе, и обе нужны: первая отвечает на вопрос «чем платим завтра»,
      вторая — «сколько мы уже должны отработать».
    </div>
  </section>`;
}

function cash(k){
  const opexPerClient = (k.opex_after && k.clients_active) ? k.opex_after/k.clients_active : null;
  return `
  <section>
    <div class="eyebrow">Денежный поток и расходы</div>
    <div class="cols c3">
      <div class="col"><div class="k">Остаток на 01.06</div>
        <div class="v">${Nf(k.cash_open)} ₽</div><div class="s">факт</div></div>
      <div class="col"><div class="k">Прогноз на 31.12</div>
        <div class="v petrol">${Nf(k.cash_eoy)} ₽</div>
        <div class="s">приток ${Nc(k.inflow_period)} · отток ${Nc(k.outflow_period)}</div></div>
      <div class="col"><div class="k">OPEX на одного клиента</div>
        <div class="v">${Nf(opexPerClient)} ₽</div>
        <div class="s">${Nf(k.opex_after)} ₽/мес ÷ ${k.clients_active??'—'} клиентов. Единственный рычаг — количество клиентов</div></div>
    </div>
    <div class="callout">
      <b>Прогноз остатка не учитывает НДС к уплате.</b> Плановый НДС с реализации за год — около 14,4 млн ₽,
      квартальные суммы ещё не подтверждены бухгалтерией. Реальный остаток на конец года будет ниже.
    </div>
  </section>`;
}

/* ── график ── */
let chart=null;
function buildChart(d){
  const el=document.getElementById('cm'); if(!el) return;
  if(typeof Chart==='undefined' || !d.rv.length || !d.eb.length){
    el.closest('.cwrap').innerHTML =
      '<div class="note" style="display:flex;height:100%;align-items:center;justify-content:center;text-align:center">'
      + 'График недоступен: не загрузилась библиотека Chart.js или в фиде нет строк RV / EB.</div>';
    return;
  }
  if(chart) chart.destroy();
  const rvP=d.rv.map(x=>x[0]??0), rvF=d.rv.map(x=>x[1]??0), ebF=d.eb.map(x=>x[1]??0);
  const lastFact = rvF.reduce((acc,v,i)=>v>0?i:acc,-1);
  const css=getComputedStyle(document.documentElement);
  const petrol=css.getPropertyValue('--petrol').trim();
  const line2=css.getPropertyValue('--line2').trim();
  const warm=css.getPropertyValue('--warm').trim();
  const line=css.getPropertyValue('--line').trim();
  const mut2=css.getPropertyValue('--mut2').trim();
  const font={family:"'JetBrains Mono',monospace",size:10};

  chart=new Chart(el,{
    data:{ labels:MONTHS, datasets:[
      {type:'bar',label:'Выручка, план',data:rvP,backgroundColor:line2,borderRadius:3,order:3,
       barPercentage:.86,categoryPercentage:.82},
      {type:'bar',label:'Выручка, факт',data:rvF.map((v,i)=>i<=lastFact?v:null),backgroundColor:petrol,
       borderRadius:3,order:2,barPercentage:.5,categoryPercentage:.82},
      {type:'line',label:'EBITDA, факт',data:ebF.map((v,i)=>i<=lastFact?v:null),borderColor:warm,
       backgroundColor:warm,borderWidth:2,pointRadius:3,pointBackgroundColor:'#fff',tension:.25,order:1,yAxisID:'y'},
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},
        tooltip:{backgroundColor:'#16191B',padding:12,cornerRadius:8,titleFont:font,bodyFont:font,
          callbacks:{label:c=>` ${c.dataset.label}: ${Nf(c.raw)} ₽`}}},
      scales:{
        x:{grid:{display:false},border:{color:line},ticks:{color:mut2,font}},
        y:{grid:{color:line},border:{display:false},
           ticks:{color:mut2,font,callback:v=>Nc(v)}}}
    }});
}

/* ── рендер ── */
function render(d,demo,err,time){
  const k=d.k;
  document.getElementById('tools').innerHTML = `
    <span class="chip ${demo?'demo':'live'}">${demo?'демо-данные':'обновлено '+time}</span>
    ${err?`<span class="chip err" title="${esc(err)}">фид недоступен</span>`:''}
    <button class="chip" onclick="init()">↻ Обновить</button>`;

  document.getElementById('app').innerHTML =
    hero(k) + kpi(k) + chartSec() + portfolio(d) + payments(d) + deferred(k) + cash(k) +
    `<footer>
       <span class="mono">Фонд-Акселератор МД · ООО «Группа Развития»</span>
       <span>${esc(k.updated_label||'')} · <a href="https://fond-accelerator.ru" target="_blank" rel="noopener">fond-accelerator.ru</a></span>
     </footer>`;

  document.querySelectorAll('.phead').forEach(b=>b.addEventListener('click',()=>{
    const open=b.getAttribute('aria-expanded')==='true';
    b.setAttribute('aria-expanded', String(!open));
    document.getElementById('pb'+b.dataset.i).classList.toggle('open',!open);
  }));

  requestAnimationFrame(()=>buildChart(d));
}

async function init(){
  document.getElementById('loader').style.display='flex';
  document.getElementById('app').style.display='none';
  const {d,demo,err}=await loadData();
  const time=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('loader').style.display='none';
  document.getElementById('app').style.display='block';
  render(d,demo,err,time);
}
init();
</script>
