<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фонд-акселератор — финансы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ==============================================================
   Язык «Уровня правды» (v7, утверждён 22.09): нейтральный графит в тёмной теме,
   кость в светлой, медь — единственный акцент. Статус кодируется формой
   (● заполнено · ◐ частично · ○ пусто), а не цветом. Тёмная — по умолчанию.
   ============================================================== */
:root{
  --bg:#f5f2ec; --surface:#fbfaf7; --surface2:#efeae2; --surface3:#f3efe8; --line:#e2ddd3; --line2:#d0c9bd;
  --txt:#262624; --txt2:#45443f; --txt3:#6b6a66;
  --accent:#9a5b2a; --accent-soft:rgba(185,121,75,.13); --accent-line:rgba(154,91,42,.45);
  --ok:#2f7a4f; --watch:#8a6a2f; --bad:#b3362d;
  --bar-bg:#e9e4db; --bar-zone:#dcd5c9; --bar-fact:#262624; --dim:#d0c9bd; --dim2:#a39b8e;
  --sans:'Onest',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r-plate:20px; --r-card:16px; --r-group:14px;
}
html.dark{
  --bg:#151515; --surface:#1c1c1d; --surface2:#242425; --surface3:#2b2b2d; --line:#2c2c2e; --line2:#3a3a3c;
  --txt:#f2f2f0; --txt2:#cacacc; --txt3:#9d9d9f;
  --accent:#d08a52; --accent-soft:rgba(208,138,82,.15); --accent-line:rgba(208,138,82,.45);
  --ok:#5fbf8a; --watch:#c9a46a; --bad:#e07a6a;
  --bar-bg:#2b2b2d; --bar-zone:#353537; --bar-fact:#f2f2f0; --dim:#3a3a3c; --dim2:#6c6c70;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
@media(max-width:700px){.wrap{padding:18px 14px 60px}}

/* Шапка */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:14px}
.logo{display:inline-flex;align-items:center;gap:0}
.logo .a{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.logo .l{width:34px;height:2px;background:var(--accent)}
.logo .b{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent)}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--txt3);font-size:13px;margin-top:2px}
.controls{display:flex;gap:10px;align-items:center}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);
  border:1px solid var(--line2);border-radius:999px;padding:6px 12px;background:transparent;cursor:pointer}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Моно-метки: один уровень на блок */
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3)}
.kick.acc{color:var(--accent)}

/* Экран */
.screen{margin-bottom:52px}
.screen>h2{font-size:15px;font-weight:500;color:var(--txt2);margin:0 0 14px;display:flex;align-items:baseline;gap:14px}
.screen>h2 .kick{font-weight:500}

/* Сетки и плиты */
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-hero{grid-template-columns:1.35fr 1fr}
@media(max-width:900px){.g3,.g4{grid-template-columns:1fr 1fr}.g-hero{grid-template-columns:1fr}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-plate);padding:22px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px}
.card.soft{background:var(--surface2);border-color:transparent}

/* Числа */
.hero{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.hero small{font-size:20px;font-weight:500;color:var(--txt3);margin-left:6px;letter-spacing:0}
.big{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--txt3)}.m2{color:var(--txt2)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .lbl{color:var(--txt2)}
.row .val{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Статус формой */
.st{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid currentColor;vertical-align:-1px;margin-right:8px;color:var(--txt3)}
.st.full{background:currentColor}
.st.half{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.st.acc{color:var(--accent)}

/* Полоска план/факт */
.bar{height:8px;border-radius:4px;background:var(--bar-bg);position:relative;overflow:hidden;margin-top:10px}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--bar-fact);border-radius:4px}
.bar>b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--txt3);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* Таблица потоков */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);font-weight:500;text-align:right;padding:0 0 10px}
th:first-child,td:first-child{text-align:left}
td{padding:10px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td.b{font-weight:600}
tr.total td{border-top:1px solid var(--line2);font-weight:700}
.scroll{overflow-x:auto}

/* Траектория */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--txt3)}
.chart .plan{fill:none;stroke:var(--dim2);stroke-width:2;stroke-dasharray:4 5}
.chart .fact{fill:none;stroke:var(--bar-fact);stroke-width:2.5}
.chart .fc{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:2 4}
.chart .gap{fill:var(--accent-soft)}
.chart .dotA{fill:var(--accent)}.chart .dotB{fill:none;stroke:var(--accent);stroke-width:2}
.chart .grid{stroke:var(--line);stroke-width:1}

/* Акценты: медь — ключевая цифра экрана и её дельта. Одна медная цифра на плиту. */
.hero.acc,.big.acc{color:var(--accent)}
.delta{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:4px 10px;margin-left:10px;vertical-align:middle;white-space:nowrap}
.delta.dim{color:var(--txt3);background:var(--surface3)}
.key{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:14px;padding:14px 16px;
  border-radius:var(--r-group);background:var(--accent-soft);border:1px solid var(--accent-line)}
.key .lbl{font-weight:600;font-size:15px}
.key .val{font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.big{font-size:32px}
.card .kick,.plate .kick{display:block}
.card .big{margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.seg button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:0;background:transparent;color:var(--txt3);border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface3);color:var(--txt)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:560px){.seg{margin-left:0}.stepper{margin-left:0!important}}
.mini{font-size:12.5px;color:var(--txt3)}
/* Список клиентов */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cl{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.cl .n{font-weight:600;font-size:14px}
.cl .d{font-size:12.5px;color:var(--txt3);margin-top:3px}
.cl .d b{color:var(--txt2);font-weight:600}

/* Календарь платежей */
.sched{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:700px){.sched{grid-template-columns:1fr}}
.month{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.month .mh{display:flex;justify-content:space-between;align-items:baseline}
.month .mh .kick{color:var(--txt2)}
.month .li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line);white-space:nowrap}
.month .li:first-of-type{border-top:0;margin-top:8px}

/* Подсказки: что это · как считается · откуда. Маркер — у заголовков, не у чисел */
[data-help]{cursor:help;border-bottom:1px dotted var(--txt3);padding-bottom:1px}
[data-help]::after{content:'ⓘ';font-family:var(--mono);font-size:10px;margin-left:5px;color:var(--txt3);text-transform:none;letter-spacing:0;vertical-align:1px}
[data-help].acc::after{color:var(--accent)}
.lbl[data-help],.mini[data-help]{border-bottom:1px dotted var(--line2)}
#pop{position:absolute;z-index:50;max-width:340px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.28);font-size:12.5px;line-height:1.45;color:var(--txt2);display:none}
#pop .pt{font-weight:600;color:var(--txt);font-size:13px;margin-bottom:4px}
#pop .pw{margin-bottom:6px}
#pop .ph2,#pop .ps{color:var(--txt3);margin-top:4px}
#pop .ph2 b,#pop .ps b{color:var(--txt2);font-weight:600}
#pop .ps code{font-family:var(--mono);font-size:11px;color:var(--accent)}
/* Неделя — деньги (первый экран для МД) */
.flow .card{padding:18px 20px}
.flow .v{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:10px;font-variant-numeric:tabular-nums}
.flow .v small{font-size:14px;font-weight:500;color:var(--txt3);letter-spacing:0;margin-left:4px}
.flow .dl{margin-top:8px;font-size:12.5px;color:var(--txt3);line-height:1.4}
.flow .dl b{color:var(--txt2);font-weight:600}
.flow .card.acc{background:var(--accent-soft);border-color:var(--accent-line)}
.flow .card.acc .v{color:var(--accent)}
.payers .row{padding:7px 0}
.payers .grp{margin-top:10px;display:flex;justify-content:space-between;align-items:baseline}
.payers .grp .kick{font-size:10px}
.payers .grp .sum{font-family:var(--mono);font-size:11px;color:var(--txt2)}
.payers .row .lbl{color:var(--txt)}
.flow2{grid-template-columns:1fr 1.5fr}@media(max-width:800px){.flow2{grid-template-columns:1fr}}
#flowTable{min-width:480px}#flowTable td,#flowTable th{padding:7px 0 7px 12px;font-size:13px;white-space:nowrap}#flowTable td:first-child,#flowTable th:first-child{padding-left:0}
#flowTable tr.sel td{color:var(--accent);font-weight:600}
#flowTable tr.cur td{color:var(--txt3)}
details.plate>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px}
details.plate>summary::-webkit-details-marker{display:none}
details.plate>summary .kick::before{content:'▸ ';}
details.plate[open]>summary .kick::before{content:'▾ ';}
details.plate>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Неделя к неделе */
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper .chip{padding:5px 10px;line-height:1}
.stepper .chip[disabled]{opacity:.35;cursor:default}
.stepper .wkLbl{color:var(--txt);min-width:150px;text-align:center}
.wkcard{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.wkcard.acc{background:var(--accent-soft);border-color:var(--accent-line)}
.wkcard .v{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums}
.wkcard .v small{font-size:13px;font-weight:500;color:var(--txt3);letter-spacing:0;margin-left:4px}
.wkcard .dl{margin-top:8px;font-size:12.5px;color:var(--txt3)}
.wkcard .dl b{font-family:var(--mono);font-weight:500;color:var(--txt);font-size:12px;letter-spacing:.04em}
.wkcard.acc .dl b{color:var(--accent)}
.chart.wk .wb{fill:var(--dim2);cursor:pointer} .chart.wk .wb.sel{fill:var(--accent)} .chart.wk .wb.cur{fill:none;stroke:var(--accent);stroke-width:2}
.chart.wk .wb.cur.sel{fill:var(--accent-soft)}
.chart.wk .ln{fill:none;stroke:var(--bar-fact);stroke-width:2} .chart.wk .pt{fill:var(--surface);stroke:var(--dim2);stroke-width:2;cursor:pointer}
.chart.wk .pt.sel{fill:var(--accent);stroke:var(--accent)} .chart.wk .pt.cur{stroke:var(--accent);stroke-dasharray:2 2}
.chart.wk .zero{stroke:var(--line2);stroke-width:1}
.note{font-size:12.5px;color:var(--txt3);margin-top:12px;line-height:1.5}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--txt3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(prefers-reduced-motion:no-preference){.plate,.card{transition:background .2s,border-color .2s}}
</style>
<style>
#loader{display:flex;align-items:center;gap:14px;padding:60px 0;color:var(--txt3)}
#err{display:none;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-card);padding:16px 20px;margin:20px 0}
.empty{color:var(--txt3);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div id="loader"><span class="logo"><span class="a"></span><span class="l"></span><span class="b"></span></span><span class="kick">Загружаю фид WEB</span></div>
  <div id="err"></div>
  <div id="app" style="display:none"></div>
</div>
<script>
/* ============================================================
   Финансовый дашборд фонда. v18+ (07.10.2026): первый экран — неделя по банку (колонки W 14–19). Источник — вкладка WEB финмодели,
   опубликованная как CSV. Формат строк: тип · ключ · значение.
   K — скаляр; M — месяц; CL — клиент; PS — платёж; CH — канал;
   W — недельный срез (лист «Недели»: история по воскресеньям + текущий срез на дату фида).
   Совместимость: feed_version должен начинаться с "v18".
   ============================================================ */
const FEED_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQm44TrbgO6MvBJYKetceRUs0agWwmQOdp3QV0Dy4cOfDuX5vhDCKF3spgpVnh2gQ2E5kBOMDjeye08/pub?gid=2058251631&single=true&output=csv';
const FEED_MIN = 'v18';

// ---------- CSV ----------
function parseCSV(t){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(cell);rows.push(row);row=[];cell=''; }
    else cell+=c; }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
// Числа приходят в формате ячейки Sheets: «18 507 881», «488037,3406», «(1 840 440)», «29,5%», «-» вместо нуля
function num(v){ if(v==null) return null; let s=String(v).trim(); if(s==='') return null; if(s==='-'||s==='—'||s==='–') return 0;
  let neg=false; if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  s=s.replace(/[\s\u00A0\u202F]/g,'').replace(/[−–]/g,'-').replace(/₽|руб\.?/g,'');
  let pct=false; if(s.endsWith('%')){pct=true;s=s.slice(0,-1);}
  if(s.includes(',')&&!s.includes('.')) s=s.replace(',','.'); else s=s.replace(/,/g,'');
  const n=Number(s); if(!Number.isFinite(n)) return null; return (neg?-n:n)/(pct?100:1); }
// Даты приходят как «30.09.2026», «2026-09-30» или серийным числом Sheets
function dat(v){ if(v==null) return null; const s=String(v).trim(); if(!s) return null;
  let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if(m) return new Date(Date.UTC(+m[3],+m[2]-1,+m[1]));
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  const n=num(s); if(n!=null&&n>30000&&n<80000) return new Date(Date.UTC(1899,11,30)+n*864e5); return null; }
function load(rows){
  const K={},M=[],CL=[],PS=[],CH=[],W=[];
  for(const r of rows){ const t=r[0];
    if(t==='K') K[r[1]]=r[2];
    else if(t==='M') M.push({m:num(r[1]),rp:num(r[2]),rf:num(r[3]),ep:num(r[4]),ef:num(r[5]),ap:num(r[6]),af:num(r[7]),mp:num(r[8]),mf:num(r[9])});
    else if(t==='CL') CL.push({name:r[1],co:r[2],st:r[3],tariff:r[4],tracker:r[5],note:r[6]});
    else if(t==='PS'){const a=num(r[3]); if(a>0) PS.push({name:r[1],m:num(r[2]),amount:a});}
    else if(t==='CH') CH.push({ch:r[1],inv:num(r[2])||0,col:num(r[3])||0});
    else if(t==='W'){const from=dat(r[1]); if(from) W.push({from,to:dat(r[2]),cash:num(r[3]),rev:num(r[4]),aks:num(r[5]),mm:num(r[6]),exp:num(r[7]),ebitda:num(r[8]),drev:num(r[9]),debitda:num(r[10]),dcash:num(r[11]),cur:String(r[12]||'').trim()==='cur',inn:num(r[13]),out:num(r[14]),tax:num(r[15]),nsales:num(r[16]),payers:String(r[17]||'').trim(),sales:num(r[18]),aksNew:num(r[19]),aksCur:num(r[20]),mm:num(r[21])});} }
  W.sort((a,b)=>a.from-b.from||(a.cur?1:-1));
  return {K,M,CL,PS,CH,W};
}

// ---------- формат ----------
const fmtM=v=>{const n=num(v); if(n==null) return '—'; return (n/1e6).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' М';};
const fmtR=v=>{const n=num(v); if(n==null) return '—'; return Math.round(n).toLocaleString('ru-RU');};
const fmtPct=v=>{const n=num(v); if(n==null) return '—'; return Math.round(n*100)+' %';};
const sign=v=>{const n=num(v); if(n==null) return '—'; return (n>=0?'+':'−')+fmtM(Math.abs(n));};
const fmtD=d=>d?String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0'):'—';
const wkLabel=w=>w?(w.cur?fmtD(w.from)+'–'+fmtD(w.to)+' · текущая':fmtD(w.from)+'–'+fmtD(w.to)):'—';
const MONTHS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONTHS_FULL=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function theme(){
  const b=document.getElementById('theme'), root=document.documentElement; let t='dark';
  try{t=localStorage.getItem('fond-theme')||'dark'}catch(e){}
  const apply=v=>{root.classList.toggle('dark',v==='dark');b.textContent=v==='dark'?'Светлая тема':'Тёмная тема';try{localStorage.setItem('fond-theme',v)}catch(e){}};
  apply(t); b.addEventListener('click',()=>apply(root.classList.contains('dark')?'light':'dark'));
}

function chart(D){
  const K=D.K, fm=num(K.feed_month)||9, M=D.M.slice().sort((a,b)=>a.m-b.m);
  const cum=a=>a.reduce((acc,v)=>{acc.push((acc.length?acc[acc.length-1]:0)+(v||0));return acc},[]);
  const build=(pk,fk)=>{const plan=M.map(r=>r[pk]||0), fact=M.filter(r=>r.m<=fm).map(r=>r[fk]||0);
    const P=cum(plan), F=cum(fact); const FC=cum(fact.concat(plan.slice(fm))).slice(fm-1); return {P,F,FC};};
  const cfg={ebitda:{...build('ep','ef'),kick:'Траектория · EBITDA нарастающим, точка А → точка Б',unit:v=>fmtM(v)},
             rev:{...build('rp','rf'),kick:'Траектория · выручка gross нарастающим, точка А → точка Б',unit:v=>fmtM(v)}};
  const x0=60,x1=1080,y0=250,yTop=90,step=(x1-x0)/11,x=i=>x0+i*step;
  const g=document.getElementById('months'); g.innerHTML='';
  MONTHS.forEach((n,i)=>{const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',x(i));t.setAttribute('y',272);t.setAttribute('text-anchor','middle');t.textContent=n;g.appendChild(t)});
  function draw(m){const d=cfg[m]; const all=d.P.concat(d.F,d.FC); const st=5e6; const lo=Math.floor(Math.min(0,...all)/st)*st, hi=Math.ceil(Math.max(...all)/st)*st; const rng=(hi-lo)||1;
    const y=v=>y0-((v-lo)/rng)*(y0-yTop); const pts=a=>a.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    document.getElementById('plan').setAttribute('points',pts(d.P)); document.getElementById('fact').setAttribute('points',pts(d.F));
    document.getElementById('fc').setAttribute('points',d.FC.map((v,i)=>`${x(fm-1+i)},${y(v)}`).join(' '));
    const i1=fm-1, i0=Math.max(0,i1-2); let p=`M${x(i0)},${y(d.F[i0])}`;
    for(let i=i0;i<=i1;i++) p+=` L${x(i)},${y(d.F[i])}`; for(let i=i1;i>=i0;i--) p+=` L${x(i)},${y(d.P[i])}`;
    document.getElementById('gap').setAttribute('d',p+' Z');
    const A=document.getElementById('dotA');A.setAttribute('cx',x(i1));A.setAttribute('cy',y(d.F[i1]));
    const B=document.getElementById('dotB');B.setAttribute('cx',x(11));B.setAttribute('cy',y(d.P[11]));
    const la=document.getElementById('lblA');la.setAttribute('x',x(i1));la.setAttribute('y',y(d.F[i1])+22);la.textContent='А · '+d.unit(d.F[i1]);
    const lb=document.getElementById('lblB');lb.setAttribute('x',x(11)-10);lb.setAttribute('y',y(d.P[11])-12);lb.textContent='Б · '+d.unit(d.P[11]);
    document.getElementById('ay0').textContent=fmtM(lo).replace(',00',''); document.getElementById('ay1').textContent=fmtM(lo+rng/2).replace(',00',''); document.getElementById('ay2').textContent=fmtM(hi).replace(',00','');
    document.getElementById('chartKick').textContent=d.kick;
    const dev=d.F[i1]-d.P[i1], rest=d.P[11]-d.P[i1], decShare=M[11][m==='ebitda'?'ep':'rp'];
    document.getElementById('chartNote').textContent=`Факт на сегодня — ${d.unit(d.F[i1])} против ${d.unit(d.P[i1])} по плану к концу ${MONTHS[i1]}: ${dev>=0?'опережение':'отставание'} ${fmtM(Math.abs(dev))}. До конца года план добавляет ${fmtM(rest)}; декабрь один даёт ${fmtM(decShare)}.`;
    document.querySelectorAll('.seg button[data-m]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m?'true':'false'));}
  document.querySelectorAll('.seg button[data-m]').forEach(b=>b.addEventListener('click',()=>draw(b.dataset.m)));
  draw('ebitda');
}

// ---------- неделя к неделе ----------
// W-строки: история по воскресеньям (hist) + текущий срез на дату фида (cur). Сдвиг = выбранная неделя минус предыдущая.
function weekly(D){
  const W=D.W; if(!W.length) return;
  const svg=document.getElementById('wkChart'), cards=document.getElementById('wkCards'), lbl=document.getElementById('wkLbl');
  const bPrev=document.getElementById('wkPrev'), bNext=document.getElementById('wkNext'), bNow=document.getElementById('wkNow');
  let sel=W.length-1, mode='ebitda';
  const NS='http://www.w3.org/2000/svg', el=(t,a)=>{const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e;};
  const d=(i,k)=>{const w=W[i], p=W[i-1]; if(w[k]==null) return null; if(w['d'+k]!=null&&i>0) return w['d'+k]; return p&&p[k]!=null?w[k]-p[k]:null;};
  const dl=(v,unit)=>v==null?'первая точка истории':`<b>${sign(v)}</b> ${unit}`;
  function cardsDraw(){
    const w=W[sel], p=W[sel-1]; const ref=p?`к ${fmtD(p.to)}`:'';
    cards.innerHTML=`
      <div class="wkcard acc"><span class="kick">Касса${w.cur?' · на '+fmtD(w.to):' · на '+fmtD(w.to)}</span><div class="v num">${fmtR(w.cash)}<small>₽</small></div><div class="dl">${dl(d(sel,'cash'),'за неделю '+ref)}</div></div>
      <div class="wkcard"><span class="kick">Выручка gross · с начала года</span><div class="v num">${fmtM(w.rev)}</div><div class="dl">${dl(d(sel,'rev'),'за неделю')}${w.aks!=null?` · акселерация ${fmtM(w.aks)}${w.mm!=null?', ММ '+fmtM(w.mm):''}`:''}</div></div>
      <div class="wkcard"><span class="kick">EBITDA · с начала года</span><div class="v num">${fmtM(w.ebitda)}</div><div class="dl">${dl(d(sel,'ebitda'),'за неделю')}${w.exp!=null?` · расходы ${fmtM(w.exp)}`:''}</div></div>`;
    lbl.textContent=wkLabel(w); bPrev.disabled=sel===0; bNext.disabled=sel===W.length-1; bNow.disabled=sel===W.length-1;
    const cnt=W.filter(x=>!x.cur).length, first=W[0];
    document.getElementById('wkNote').textContent=(w.cur?`Текущая неделя — срез на дату фида ${fmtD(w.to)}, неделя не закрыта: сравнение с воскресеньем ${p?fmtD(p.to):'—'}. `:`Срез на воскресенье ${fmtD(w.to)}; сдвиг — к предыдущему воскресенью. `)+`Закрытых недель в истории — ${cnt}, с ${fmtD(first.from)}. Выручка и EBITDA — нарастающим по кассовому P&L; касса — расчётный остаток на конец недели.`;
  }
  function chartDraw(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    const x0=60,x1=1080,y0=190,yT=24,n=W.length,step=(x1-x0)/Math.max(1,n-1),x=i=>n>1?x0+i*step:(x0+x1)/2, bw=Math.min(40,step*0.62);
    const vals=W.map((w,i)=>mode==='cash'?w.cash:d(i,mode==='rev'?'rev':'ebitda'));
    const nums=vals.filter(v=>v!=null); if(!nums.length) return;
    const st=mode==='cash'?5e6:1e6; let lo=Math.floor(Math.min(0,...nums)/st)*st, hi=Math.ceil(Math.max(0,...nums)/st)*st; if(hi===lo) hi=lo+st;
    const y=v=>y0-((v-lo)/(hi-lo))*(y0-yT);
    [...new Set([lo,lo<0&&hi>0?0:(lo+hi)/2,hi])].forEach(v=>{svg.appendChild(el('line',{class:'grid',x1:x0-10,x2:x1,y1:y(v),y2:y(v)})); const t=el('text',{x:8,y:y(v)+4}); t.textContent=fmtM(v).replace(',00',''); svg.appendChild(t);});
    if(lo<0&&mode!=='cash') svg.appendChild(el('line',{class:'zero',x1:x0-10,x2:x1,y1:y(0),y2:y(0)}));
    const every=n>12?2:1;
    W.forEach((w,i)=>{ if(i%every===0||i===n-1){const t=el('text',{x:x(i),y:214,'text-anchor':'middle'}); t.textContent=fmtD(w.to); svg.appendChild(t);} });
    if(mode==='cash'){
      svg.appendChild(el('polyline',{class:'ln',points:W.map((w,i)=>`${x(i)},${y(vals[i]??0)}`).join(' ')}));
      W.forEach((w,i)=>{ if(vals[i]==null) return; const c=el('circle',{class:'pt'+(i===sel?' sel':'')+(w.cur?' cur':''),cx:x(i),cy:y(vals[i]),r:i===sel?7:5}); c.addEventListener('click',()=>go(i)); svg.appendChild(c); });
    } else {
      W.forEach((w,i)=>{ const v=vals[i]; if(v==null) return; const top=Math.min(y(v),y(0)), h=Math.max(2,Math.abs(y(v)-y(0)));
        const r=el('rect',{class:'wb'+(i===sel?' sel':'')+(w.cur?' cur':''),x:x(i)-bw/2,y:top,width:bw,height:h,rx:3}); r.addEventListener('click',()=>go(i)); svg.appendChild(r); });
    }
    const v=vals[sel]; if(v!=null){const t=el('text',{x:x(sel),y:Math.max(14,y(Math.max(v,0))-10),'text-anchor':sel===n-1?'end':(sel===0?'start':'middle'),style:'fill:var(--accent)'}); t.textContent=(mode==='cash'?'':(v>=0?'+':'−'))+fmtM(Math.abs(v)); svg.appendChild(t);}
    document.getElementById('wkKick').textContent={ebitda:'EBITDA за неделю · приращение нарастающего итога',rev:'Выручка gross за неделю · поступления по кассе',cash:'Касса на конец недели · расчётный остаток'}[mode];
  }
  function go(i){ sel=Math.max(0,Math.min(W.length-1,i)); cardsDraw(); chartDraw(); }
  bPrev.addEventListener('click',()=>go(sel-1)); bNext.addEventListener('click',()=>go(sel+1)); bNow.addEventListener('click',()=>go(W.length-1));
  document.getElementById('weekly').addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'){go(sel-1);e.preventDefault();} else if(e.key==='ArrowRight'){go(sel+1);e.preventDefault();} });
  document.querySelectorAll('#weekly .seg button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.w; document.querySelectorAll('#weekly .seg button').forEach(o=>o.setAttribute('aria-pressed',o===b?'true':'false')); chartDraw();}));
  go(W.length-1);
}

 ev_invoiced:['В счетах, не оплачено','Выставленные счета за событие без оплаты, включая остатки по предоплатам. Это ожидания, не деньги.','Сумма счетов − оплачено по реестру ММ.','ключ ev_next_invoiced'],
 ev_contrib:['Вклад события при цели','Сколько событие принесёт фонду после прямых расходов, если цель будет выполнена.','Цель без НДС − смета прямых расходов.','лист «ЮЭ_ММ»; ключ ev_next_contrib_plan'],
 ev_last:['Итог прошлого события','Фактический результат августовского мастермайнда: выручка, участники, прямые расходы, вклад.','По кассе и смете события.','лист «ЮЭ_ММ»; ключи ev_last_*'],
};
function help(){
  const pop=document.createElement('div'); pop.id='pop'; pop.setAttribute('role','tooltip'); document.body.appendChild(pop);
  let cur=null, pinned=false;
  const show=(el)=>{const h=HELP[el.dataset.help]; if(!h) return; cur=el;
    pop.innerHTML=`<div class="pt">${esc(h[0])}</div><div class="pw">${esc(h[1])}</div>${h[2]?`<div class="ph2"><b>Как считается.</b> ${esc(h[2])}</div>`:''}${h[3]?`<div class="ps"><b>Откуда.</b> <code>${esc(h[3])}</code></div>`:''}`;
    pop.style.display='block'; const r=el.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight, vw=document.documentElement.clientWidth;
    let x=r.left+window.scrollX, y=r.bottom+window.scrollY+8; if(x+pw>vw-12) x=Math.max(12,vw-12-pw); if(r.bottom+ph+8>window.innerHeight&&r.top>ph+8) y=r.top+window.scrollY-ph-8;
    pop.style.left=x+'px'; pop.style.top=y+'px';};
  const hide=()=>{if(pinned) return; pop.style.display='none'; cur=null;};
  document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-help]'); if(t&&t!==cur&&!pinned) show(t);});
  document.addEventListener('mouseout',e=>{const t=e.target.closest('[data-help]'); if(t&&!t.contains(e.relatedTarget)) hide();});
  document.addEventListener('click',e=>{const t=e.target.closest('[data-help]');
    if(t){ if(pinned&&cur===t){pinned=false;hide();} else {pinned=true;show(t);} e.preventDefault(); e.stopPropagation(); return; }
    if(!pop.contains(e.target)){pinned=false;hide();}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){pinned=false;hide();}});
  window.addEventListener('scroll',()=>{if(cur&&!pinned) hide();},{passive:true});
}

// ---------- неделя — деньги ----------
// Четыре числа по банку: пришло, ушло, на счетах на конец, продажи (оплаты клиентов). Было + пришло − ушло = стало.
function flow(D){
  const W=D.W, hist=W.filter(w=>!w.cur&&w.inn!=null), cur=W.find(w=>w.cur&&w.inn!=null);
  if(!hist.length) return;
  const pl=(n,a,b,c)=>{n=Math.abs(n)%100; const d=n%10; return n>10&&n<20?c:d===1?a:d>=2&&d<=4?b:c;};
  const hasTypes=w=>w.aksNew!=null||w.aksCur!=null||w.mm!=null;
  const TYPES=[['новый','Акселерация · новые клиенты','aksNew'],['действующий','Акселерация · действующие','aksCur'],['ММ','Мастермайнд','mm']];
  const cards=document.getElementById('flowCards'), pay=document.getElementById('flowPayers'), tbl=document.getElementById('flowTable'), kick=document.getElementById('flowKick'), note=document.getElementById('flowNote');
  function show(mode){
    const w=mode==='cur'&&cur?cur:hist[hist.length-1];
    const idx=W.indexOf(w), prev=W[idx-1]; const was=prev?prev.cash:null;
    const other=(w.inn||0)-(w.sales||0), tax=w.tax||0, delta=(w.inn||0)-(w.out||0);
    kick.textContent=w.cur?`Эта неделя · с ${fmtD(w.from)} по ${fmtD(w.to)} · неделя не закрыта`:`Закрытая неделя · ${fmtD(w.from)}–${fmtD(w.to)} · пн–вс`;
    cards.innerHTML=`
      <div class="card acc"><span class="kick" data-help="flow_in">Пришло на счета</span><div class="v num">+${fmtR(w.inn)}<small>₽</small></div><div class="dl">${w.sales?`оплаты клиентов <b>${fmtR(w.sales)}</b>`:'оплат клиентов не было'}${other>0.5?` · проценты и прочее <b>${fmtR(other)}</b>`:''}</div></div>
      <div class="card"><span class="kick" data-help="flow_out">Ушло со счетов</span><div class="v num">${w.out?'−'+fmtR(w.out):'0'}<small>₽</small></div><div class="dl">${tax>0?`в т.ч. налоги и НДС <b>${fmtR(tax)}</b>`:'налогов и НДС на неделе не было'}${w.out&&w.out-tax>0.5?` · остальное <b>${fmtR(w.out-tax)}</b>`:''}</div></div>
      <div class="card"><span class="kick" data-help="flow_cash">На счетах · на ${fmtD(w.to)}</span><div class="v num">${fmtR(w.cash)}<small>₽</small></div><div class="dl">${was!=null?`было <b>${fmtR(was)}</b> → за неделю <b>${delta>=0?'+':'−'}${fmtR(Math.abs(delta))}</b>`:'первая неделя истории'}</div></div>
      <div class="card"><span class="kick" data-help="flow_sales">Продажи · оплаты клиентов</span><div class="v num">${w.sales?fmtR(w.sales):'0'}<small>₽</small></div><div class="dl">${w.nsales?`<b>${fmtR(w.nsales)}</b> ${pl(w.nsales,'оплата','оплаты','оплат')}`:'без оплат'}${hasTypes(w)?`<br>акселерация новые <b>${fmtR(w.aksNew||0)}</b> · действующие <b>${fmtR(w.aksCur||0)}</b> · ММ <b>${fmtR(w.mm||0)}</b>`:''}${w.drev!=null&&w.sales!=null&&Math.abs(w.drev-w.sales)>0.5?`<br>в выручке <b>${fmtR(w.drev)}</b> — с учётом возвратов`:''}</div></div>`;
    const parts=(w.payers||'').split(' · ').map(s=>s.trim()).filter(s=>s&&s!=='—');
    const items=parts.map(s=>{const tg=s.match(/\[(новый|действующий|ММ)\]/); const clean=s.replace(/\s*\[(новый|действующий|ММ)\]/,''); const m=clean.match(/^(.+?)\s(\d[\d\s]*\d|\d)(\s*\(.*\))?$/); return {type:tg?tg[1]:null,name:m?m[1]:clean,note:m&&m[3]?m[3].trim():'',amt:m?m[2]:''};});
    const rowHtml=i=>`<div class="row"><span class="lbl">${esc(i.name)}${i.note?' <span class="muted">'+esc(i.note)+'</span>':''}</span><span class="val">${esc(i.amt)}</span></div>`;
    const typed=items.some(i=>i.type);
    pay.innerHTML=!items.length?'<div class="empty" style="margin-top:8px">Оплат от клиентов на этой неделе не было</div>':
      typed?TYPES.map(([t,label,k])=>{const g=items.filter(i=>i.type===t); if(!g.length) return ''; return `<div class="grp"><span class="kick">${label}</span><span class="sum">${w[k]!=null?fmtR(w[k]):''}</span></div>${g.map(rowHtml).join('')}`;}).join('')+(items.some(i=>!i.type)?`<div class="grp"><span class="kick">Прочее</span></div>${items.filter(i=>!i.type).map(rowHtml).join('')}`:'')
      :items.map(rowHtml).join('');
    const last=hist.slice(-5).concat(cur?[cur]:[]);
    tbl.innerHTML=`<thead><tr><th>Неделя</th><th><span data-help="flow_in">Пришло</span></th><th><span data-help="flow_out">Ушло</span></th><th><span data-help="flow_cash">На счетах</span></th><th><span data-help="flow_sales">Продажи</span></th></tr></thead><tbody>${last.map(x=>`<tr class="${x===w?'sel':''}${x.cur?' cur':''}"><td>${fmtD(x.from)}–${fmtD(x.to)}${x.cur?' · эта':''}</td><td>+${fmtR(x.inn)}</td><td>${x.out?'−'+fmtR(x.out):'0'}</td><td>${fmtR(x.cash)}</td><td>${x.sales?fmtR(x.sales):'—'}${x.nsales?` <span class="muted">(${fmtR(x.nsales)})</span>`:''}</td></tr>`).join('')}</tbody>`;
    note.textContent=`Все суммы — по выписке банка, без внутренних переводов между счетами; пришло включает проценты по депозиту, ушло — налоги и НДС. Касса на конец = было + пришло − ушло. ${cur?`Эта неделя — с понедельника по дату фида ${fmtD(cur.to)}.`:''}`;
    document.querySelectorAll('#flow .seg button[data-f]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===mode?'true':'false'));
  }
  document.querySelectorAll('#flow .seg button[data-f]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.f)));
  show('closed');
}

function fail(msg){document.getElementById('loader').style.display='none';const e=document.getElementById('err');e.style.display='';e.innerHTML=`<div class="kick acc">Фид не загрузился</div><div style="margin-top:8px">${esc(msg)}</div><div class="note">Проверь, что вкладка WEB опубликована как CSV и версия фида начинается с ${FEED_MIN}.</div>`;}

(async function(){
  try{
    let text;
    if(window.__FEED_CSV__) text=window.__FEED_CSV__;
    else{ const r=await fetch(FEED_URL,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); text=await r.text(); }
    const D=load(parseCSV(text));
    if(!String(D.K.feed_version||'').startsWith(FEED_MIN)) throw new Error('Версия фида «'+(D.K.feed_version||'не указана')+'», страница ждёт '+FEED_MIN);
    render(D);
  }catch(e){fail(e.message);}
})();
</script>
